all:
  children:
    primary_cluster:
      vars:
        pgbackrest_stanza_name: "docpg-cls1"
        patroni_cluster_name: "docpg-cls1"
      children:
        primary_cluster_leader:
          hosts:
            docpg-cls1-pg1:
              ip: "172.18.0.11"   # Container IP on lab-network

        primary_cluster_replica:
          hosts:
            docpg-cls1-pg2:
              ip: "172.18.0.12"
            docpg-cls1-pg3:
              ip: "172.18.0.13"
              patroni_tag_nofailover: true
              patroni_tag_nosync: true

    standby_cluster:
      vars:
        pgbackrest_stanza_name: "docpg-cls1"
        patroni_cluster_name: "docpg-cls1"
        patroni_standby_cluster_slot_name: "standby_cluster_slot"
      children:
        standby_cluster_leader:
          hosts:
            docpg-cls1-pg4:
              ip: "172.18.0.14"
              patroni_standby_cluster:
                host: "172.18.0.10"   # Primary cluster leader VIP (floats to current leader)
                port: 5432
        standby_cluster_replica:
          hosts:
            # docpg-cls1-pg5:
            #   ip: "172.18.0.15"
            # docpg-cls1-pg6:
            #   ip: "172.18.0.16"

  vars:
    # Containers expose NO host ports — Ansible reaches them via `docker exec`
    # using the community.docker.docker connection plugin. The plugin uses
    # `inventory_hostname` as the container name, so each container is named
    # `docpg-cls1-pg{N}` (matching the entries above).
    docker_network: lab-network
    docker_network_subnet: "172.18.0.0/16"
    ansible_connection: community.docker.docker
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
