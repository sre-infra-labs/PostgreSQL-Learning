---
- name: Begin pg_cluster/custom/etcd.yml
  ansible.builtin.debug:
    msg: "Installing etcd {{ etcd_version }} on {{ inventory_hostname }} ({{ ip }})"

- name: Set etcd download architecture
  ansible.builtin.set_fact:
    etcd_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"

- name: Download etcd {{ etcd_version }} tarball directly into container
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    dest: "/tmp/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    mode: '0644'

- name: Extract etcd binaries
  ansible.builtin.unarchive:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}/etcd"

- name: Install etcd and etcdctl to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  loop:
    - etcd
    - etcdctl

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    system: yes
    shell: /bin/false
    home: /var/lib/etcd
    create_home: no

- name: Create etcd data directory
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: '0700'

- name: Create etcd config directory
  ansible.builtin.file:
    path: /etc/etcd
    state: directory
    mode: '0755'

- name: Generate /etc/etcd/etcd.env from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/etcd.env.j2"
    dest: /etc/etcd/etcd.env
    owner: etcd
    group: etcd
    mode: '0640'

- name: Deploy etcd systemd service
  ansible.builtin.template:
    src: "{{ role_path }}/templates/etcd.service.j2"
    dest: /etc/systemd/system/etcd.service
    mode: '0644'
  notify: reload systemd daemon

- name: Wait for apt lock to be released before starting etcd
  ansible.builtin.shell: |
    while fuser /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock* 2>/dev/null; do
      sleep 1
    done
  timeout: 30
  changed_when: false

# ─── Existing-cluster replica mode: wipe stale etcd data, then just enable ───
# A previous failed run may have left /var/lib/etcd with old raft state.
# Starting etcd with that data while INITIAL_CLUSTER_STATE=existing causes an
# immediate clean exit (Duration: 1ms). Always wipe before ACTIVATE starts it.
- name: Stop etcd and wipe stale data directory (existing-cluster replica mode)
  ansible.builtin.shell: |
    systemctl stop etcd 2>/dev/null || true
    rm -rf /var/lib/etcd/*
  args:
    executable: /bin/bash
  when: (etcd_cluster_state | default('new')) == 'existing'
  changed_when: true

# Reload systemd + enable the unit but do NOT start it; ACTIVATE will start it
# after registering the node as an etcd learner on the leader.
- name: Reload systemd daemon and enable etcd unit (existing-cluster mode — ACTIVATE starts it)
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    daemon_reload: true
  when: (etcd_cluster_state | default('new')) == 'existing'

# ─── New cluster mode: start etcd now and verify health ──────────────────────
- name: Reload systemd, enable and start etcd service (new cluster mode)
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
  when: (etcd_cluster_state | default('new')) != 'existing'

- name: Check if etcd process is running (with retries for startup)
  ansible.builtin.command: systemctl is-active etcd
  register: etcd_process_check
  changed_when: false
  failed_when: false
  retries: 10
  delay: 1
  until: etcd_process_check.rc == 0
  timeout: 30
  when: (etcd_cluster_state | default('new')) != 'existing'

- name: Show etcd status if not running
  ansible.builtin.command: systemctl status etcd --no-pager
  when:
    - (etcd_cluster_state | default('new')) != 'existing'
    - etcd_process_check is defined
    - etcd_process_check.rc != 0
  changed_when: false
  ignore_errors: true

- name: Show recent etcd logs for diagnosis
  ansible.builtin.command: journalctl -u etcd -n 50 --no-pager
  when:
    - (etcd_cluster_state | default('new')) != 'existing'
    - etcd_process_check is defined
    - etcd_process_check.rc != 0
  changed_when: false
  ignore_errors: true

- name: Fail if etcd process is not running
  ansible.builtin.fail:
    msg: "etcd process is not running on {{ inventory_hostname }}. Check logs above."
  when:
    - (etcd_cluster_state | default('new')) != 'existing'
    - etcd_process_check is defined
    - etcd_process_check.rc != 0

- name: Wait for etcd client port on this node
  ansible.builtin.shell: |
    curl -s http://127.0.0.1:2379/health >/dev/null 2>&1 && echo "ok" || echo "fail"
  args:
    executable: /bin/bash
  register: etcd_wait
  until: etcd_wait.stdout.strip() == "ok"
  retries: 5
  delay: 1
  timeout: 30
  ignore_errors: true
  when: (etcd_cluster_state | default('new')) != 'existing'

- name: Verify etcd health on {{ inventory_hostname }}
  ansible.builtin.shell: |
    curl -s http://127.0.0.1:2379/health >/dev/null 2>&1 && echo "ok" || echo "fail"
  args:
    executable: /bin/bash
  register: etcd_health_check
  until: etcd_health_check.stdout.strip() == "ok"
  retries: 5
  delay: 1
  timeout: 30
  ignore_errors: true
  when: (etcd_cluster_state | default('new')) != 'existing'

- name: etcd is healthy on {{ inventory_hostname }}
  ansible.builtin.debug:
    msg: "etcd running on {{ inventory_hostname }} ({{ ip }}:2379)"
  when: (etcd_cluster_state | default('new')) != 'existing'
