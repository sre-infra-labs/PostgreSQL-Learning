---
- name: Begin pg_cluster/custom/keepalived.yml
  ansible.builtin.debug:
    msg: "Installing Keepalived on {{ inventory_hostname }} — VIP: {{ keepalived_vip }} (VRID {{ keepalived_virtual_router_id }})"

- name: Install Keepalived
  ansible.builtin.package:
    name: keepalived
    state: present
  environment: "{{ proxy_env | default({}) }}"

- name: Allow binding to non-local IPs and preserve secondary addresses on primary removal
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-keepalived.conf
    content: |
      net.ipv4.ip_nonlocal_bind = 1
      net.ipv4.conf.all.promote_secondaries = 1
    mode: "0644"

- name: Apply keepalived sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-keepalived.conf
  changed_when: true
  ignore_errors: true

- name: Deploy Keepalived primary VIP notify script
  ansible.builtin.copy:
    dest: /usr/local/bin/keepalived_notify_primary.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Called by Keepalived: $1=GROUP|INSTANCE $2=name $3=MASTER|BACKUP|FAULT
      # Keepalived's internal ip addr add fails silently in Docker, so we force
      # it here on every VRRP state transition for the primary (write) VIP.
      STATE=$3
      VIP="{{ keepalived_vip }}"
      PREFIX="{{ keepalived_vip_prefix }}"
      IFACE="{{ keepalived_interface }}"
      LABEL="${IFACE}:vip"

      case "$STATE" in
        MASTER)
          ip addr add ${VIP}/${PREFIX} dev ${IFACE} label ${LABEL} 2>/dev/null || true
          arping -q -A -c 3 -I ${IFACE} ${VIP} 2>/dev/null || true
          ;;
        BACKUP|FAULT)
          ip addr del ${VIP}/${PREFIX} dev ${IFACE} label ${LABEL} 2>/dev/null || true
          ;;
      esac

- name: Deploy Keepalived replica VIP notify script
  ansible.builtin.copy:
    dest: /usr/local/bin/keepalived_notify_replica.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Called by Keepalived: $1=GROUP|INSTANCE $2=name $3=MASTER|BACKUP|FAULT
      # Keepalived's internal ip addr add fails silently in Docker, so we force
      # it here on every VRRP state transition for the replica (read) VIP.
      STATE=$3
      VIP="{{ keepalived_replica_vip }}"
      PREFIX="{{ keepalived_vip_prefix }}"
      IFACE="{{ keepalived_interface }}"
      LABEL="${IFACE}:rvip"

      case "$STATE" in
        MASTER)
          ip addr add ${VIP}/${PREFIX} dev ${IFACE} label ${LABEL} 2>/dev/null || true
          arping -q -A -c 3 -I ${IFACE} ${VIP} 2>/dev/null || true
          ;;
        BACKUP|FAULT)
          ip addr del ${VIP}/${PREFIX} dev ${IFACE} label ${LABEL} 2>/dev/null || true
          ;;
      esac

- name: Generate /etc/keepalived/keepalived.conf from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/keepalived.conf.j2"
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart keepalived

# Only start keepalived during full activation (pg_cluster_activate_services=true).
# When adding a new replica (pg_cluster_activate_services=false / Phase A), keepalived
# must NOT start because it would claim the cluster VIP immediately, creating an ARP
# conflict with the existing leader and breaking peer-port connectivity for etcd.
- name: Enable and start Keepalived service
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  when: pg_cluster_activate_services | default(true) | bool

- name: Enable (but do not start) Keepalived service — install-only mode
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    daemon_reload: true
  when: not (pg_cluster_activate_services | default(true) | bool)

- name: End pg_cluster/custom/keepalived.yml
  ansible.builtin.debug:
    msg: >-
      Keepalived started on {{ inventory_hostname }} (priority {{ 101 - groups['all'].index(inventory_hostname) }}) —
      VIP {{ keepalived_vip }} will be held by whichever node is the Patroni primary.
