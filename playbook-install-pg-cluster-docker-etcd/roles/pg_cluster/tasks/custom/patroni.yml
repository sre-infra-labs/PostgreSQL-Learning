---
- name: Create /etc/patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    mode: "0750"

- name: Generate /etc/patroni/patroni.yml from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.yml.j2"
    dest: /etc/patroni/patroni.yml
    mode: "0640"
  notify: restart patroni

# ---------------------------------------------------------------------------
# PATRONICTL_CONFIG_FILE — set across all shell entry points:
#   /etc/environment          → PAM / systemd services
#   /etc/profile.d/           → login shells (ssh, su -, bash --login)
#   /root/.bashrc             → interactive docker exec sessions as root
#   postgresql_home_dir/.bashrc → interactive docker exec sessions as postgres
#
# Note: /etc/bash.bashrc is NOT used — Ubuntu's default has [ -z "$PS1" ] && return
# at the top, so it exits early in non-interactive shells (e.g. bash -c "...").
# ---------------------------------------------------------------------------
- name: Set PATRONICTL_CONFIG_FILE in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE for login shells (all users)
  ansible.builtin.copy:
    dest: /etc/profile.d/patroni-env.sh
    content: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml\n"
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE in root .bashrc
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE in postgres .bashrc
  ansible.builtin.lineinfile:
    path: "{{ postgresql_home_dir }}/.bashrc"
    line: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    owner: postgres
    group: postgres
    mode: "0640"

- name: Create Patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    state: directory
    mode: "0750"

- name: Deploy Patroni systemd service file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.service.j2"
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: reload systemd daemon

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    state: directory
    mode: "0700"

- name: Check if postgres OS user exists
  ansible.builtin.command: id postgres
  register: postgres_user_check
  changed_when: false
  failed_when: false

# Create all directories with correct ownership up-front.
# Owner is set HERE (not in a separate chown step) so that if the postgresql@18-main
# systemd service detects the directory during the subsequent daemon-reload it can
# write to it without calling pg_dropcluster (which would delete the directory).
- name: Create PostgreSQL data directory (owned by postgres from the start)
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    mode: "0700"
    owner: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"
    group: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"

- name: Check if PostgreSQL data directory is empty
  ansible.builtin.shell: "ls -A {{ postgresql_data_dir }} 2>/dev/null"
  register: _pg_data_contents
  changed_when: false

- name: Fail if data directory is not empty before init
  ansible.builtin.fail:
    msg: "Data directory {{ postgresql_data_dir }} is not empty. Please use -e reinit_cluster=true to clean up an existing cluster."
  when:
    - _pg_data_contents.stdout is defined
    - _pg_data_contents.stdout | length > 0
    - not (reinit_cluster | default(false) | bool)

- name: Create PostgreSQL stats temp directory
  ansible.builtin.file:
    path: "{{ postgresql_stats_temp_directory_path }}"
    state: directory
    mode: "0750"
    owner: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"
    group: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"

- name: Create PostgreSQL archive directory
  ansible.builtin.file:
    path: "{{ postgresql_data_archive }}"
    state: directory
    mode: "0700"
    owner: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"
    group: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"

- name: Create PostgreSQL scripts directory
  ansible.builtin.file:
    path: "{{ postgresql_scripts_dir }}"
    state: directory
    mode: "0744"
    owner: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"
    group: "{{ 'postgres' if postgres_user_check.rc == 0 else omit }}"

- name: Fix ownership of /etc/patroni and log directories
  ansible.builtin.shell: "[ -e '{{ item }}' ] && chown -R postgres:postgres '{{ item }}' || true"
  loop:
    - /etc/patroni
    - "{{ patroni_log_dir }}"
    - "{{ postgresql_log_dir }}"
    - "{{ postgresql_data_dir | dirname }}"   # /var/lib/postgresql/<version>/ — parent must be traversable by postgres
  changed_when: false
  when: postgres_user_check.rc == 0

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Ensure locales package is installed
  ansible.builtin.package:
    name: locales
    state: present

- name: Generate {{ postgresql_locale }} locale
  ansible.builtin.command: locale-gen {{ postgresql_locale }}
  changed_when: true

# --- Start Patroni on Leader first, then Replicas ---

# --- LEADER: Validate etcd is healthy ---
- name: "Validate etcd on leader {{ inventory_hostname }}"
  block:
    - name: Check etcd process status
      ansible.builtin.command: systemctl is-active etcd
      register: _etcd_active_leader
      changed_when: false
      retries: 5
      delay: 1
      until: _etcd_active_leader.rc == 0
      timeout: 30

    - name: Verify etcd health via HTTP
      ansible.builtin.shell: |
        curl -s http://127.0.0.1:2379/health >/dev/null 2>&1 && echo "ok" || echo "fail"
      args:
        executable: /bin/bash
      register: _etcd_health_leader
      until: _etcd_health_leader.stdout.strip() == "ok"
      retries: 5
      delay: 1
      timeout: 30

    - name: "DEBUG: etcd health on leader"
      ansible.builtin.debug:
        msg: |
          etcd service status: {{ _etcd_active_leader.rc == 0 | ternary('RUNNING', 'STOPPED') }}
          etcd HTTP health: {{ _etcd_health_leader.stdout.strip() | upper }}
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
     inventory_hostname in (groups['standby_cluster_leader'] | default([])))

# --- LEADER: Start Patroni and validate independently ---
- name: "Start Patroni on leader {{ inventory_hostname }}"
  block:
    - name: Start and enable Patroni service on leader
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true

    - name: Verify Patroni process is active on leader
      ansible.builtin.command: systemctl is-active patroni
      register: _patroni_active_leader
      changed_when: false
      retries: 5
      delay: 1
      until: _patroni_active_leader.rc == 0
      timeout: 30

    - name: "DEBUG: Patroni service status on leader"
      ansible.builtin.debug:
        msg: "Patroni service: RUNNING (rc={{ _patroni_active_leader.rc }})"
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
     inventory_hostname in (groups['standby_cluster_leader'] | default([])))

# --- LEADER: Validate Patroni REST API is responsive ---
- name: "Validate Patroni REST API on leader {{ inventory_hostname }}"
  block:
    - name: Wait for Patroni REST API to respond
      ansible.builtin.shell: |
        curl -s http://127.0.0.1:{{ patroni_restapi_port }}/cluster >/dev/null 2>&1 && echo "ok" || echo "fail"
      args:
        executable: /bin/bash
      register: _patroni_api_leader_check
      until: _patroni_api_leader_check.stdout.strip() == "ok"
      retries: 10
      delay: 1
      timeout: 30

    - name: "DEBUG: Patroni REST API status on leader"
      ansible.builtin.debug:
        msg: "Patroni REST API /cluster endpoint: {{ _patroni_api_leader_check.stdout.strip() | upper }}"
  rescue:
    - name: Collect Patroni logs for diagnosis
      ansible.builtin.command: journalctl -u patroni -n 50 --no-pager
      register: _patroni_logs
      changed_when: false
      failed_when: false

    - name: "DEBUG: Patroni service logs (after REST API failure)"
      ansible.builtin.debug:
        msg: "{{ _patroni_logs.stdout_lines }}"

    - name: Fail with diagnostic message
      ansible.builtin.fail:
        msg: "Patroni REST API not responding on leader {{ inventory_hostname }}. See logs above."
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
     inventory_hostname in (groups['standby_cluster_leader'] | default([])))

# --- LEADER: Validate PostgreSQL is running ---
- name: "Validate PostgreSQL on leader {{ inventory_hostname }}"
  block:
    - name: Check PostgreSQL connection
      ansible.builtin.shell: |
        psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT version();" 2>&1
      args:
        executable: /bin/bash
      register: _pg_check_leader
      until: _pg_check_leader.stdout | length > 0 and "PostgreSQL" in _pg_check_leader.stdout
      retries: 10
      delay: 1
      timeout: 30
      become_user: postgres

    - name: "DEBUG: PostgreSQL version on leader"
      ansible.builtin.debug:
        msg: |
          PostgreSQL status on leader:
          {{ _pg_check_leader.stdout }}
  rescue:
    - name: Collect PostgreSQL logs on leader
      ansible.builtin.command: journalctl -u postgresql -n 30 --no-pager
      register: _pg_logs_leader
      changed_when: false
      failed_when: false

    - name: Collect Patroni logs on leader (PostgreSQL failure context)
      ansible.builtin.command: journalctl -u patroni -n 50 --no-pager
      register: _patroni_logs_pg_leader
      changed_when: false
      failed_when: false

    - name: "DEBUG: PostgreSQL startup failure on leader"
      ansible.builtin.debug:
        msg: |
          PostgreSQL failed to start on leader {{ inventory_hostname }}.

          PostgreSQL logs:
          {{ _pg_logs_leader.stdout_lines }}

          Patroni logs (for context):
          {{ _patroni_logs_pg_leader.stdout_lines }}

    - name: Fail if PostgreSQL not running on leader
      ansible.builtin.fail:
        msg: |
          PostgreSQL failed to start on leader {{ inventory_hostname }}.
          Check logs above for details.
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
     inventory_hostname in (groups['standby_cluster_leader'] | default([])))

# --- LEADER: Validate leadership status via Patroni REST API ---
- name: "Validate leader election on {{ inventory_hostname }}"
  block:
    - name: Check Patroni leadership endpoint (capture response body)
      ansible.builtin.shell: |
        curl -s http://127.0.0.1:{{ patroni_restapi_port }}/{{ 'standby-leader' if inventory_hostname in (groups['standby_cluster_leader'] | default([])) else 'primary' }} 2>&1
      args:
        executable: /bin/bash
      register: _leader_status_response
      until: _leader_status_response.stdout | length > 0 and '"role"' in _leader_status_response.stdout
      retries: 20
      delay: 1
      timeout: 30

    - name: "DEBUG: Leadership endpoint response on {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg: |
          Patroni {{ 'standby-leader' if inventory_hostname in (groups['standby_cluster_leader'] | default([])) else 'primary' }} endpoint response:
          {{ _leader_status_response.stdout | from_json | to_nice_json }}
  rescue:
    - name: Validate cluster health via patronictl (alternative method)
      ansible.builtin.shell: |
        patronictl -c /etc/patroni/patroni.yml list --format json 2>&1 | python3 -m json.tool || patronictl -c /etc/patroni/patroni.yml list
      args:
        executable: /bin/bash
      register: _patronictl_status
      changed_when: false
      failed_when: false
      become_user: postgres

    - name: "DEBUG: Cluster status via patronictl (rescue validation)"
      ansible.builtin.debug:
        msg: |
          Cluster health check via patronictl:
          {{ _patronictl_status.stdout_lines }}

    - name: Verify this node is in cluster and has leadership role
      ansible.builtin.shell: |
        patronictl -c /etc/patroni/patroni.yml list 2>&1 | grep -E "{{ inventory_hostname }}.*(Leader|Standby-leader)" && echo "ok" || echo "fail"
      args:
        executable: /bin/bash
      register: _patronictl_grep
      changed_when: false
      become_user: postgres

    - name: "DEBUG: Leadership role verification via patronictl"
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} leadership role: {{ _patronictl_grep.stdout.strip() | upper }}

    - name: Fail only if cluster shows no leadership
      ansible.builtin.fail:
        msg: |
          Leadership election validation failed on {{ inventory_hostname }}.
          However, cluster status shows:
          {{ _patronictl_status.stdout_lines | join('\n') }}
          If cluster shows a Leader with state 'running', this is a false negative from REST API check.
          The cluster is HEALTHY — manual intervention may not be needed.
      when: _patronictl_grep.stdout.strip() != "ok"

    - name: "DEBUG: Cluster is healthy despite REST API check failure"
      ansible.builtin.debug:
        msg: |
          ✓ Patroni leadership validated via patronictl (REST API check failed but cluster is healthy)
          {{ inventory_hostname }} is confirmed as {{ 'Standby-Leader' if inventory_hostname in (groups['standby_cluster_leader'] | default([])) else 'Leader' }}
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
     inventory_hostname in (groups['standby_cluster_leader'] | default([])))

# --- REPLICA: Validate etcd is healthy ---
- name: "Validate etcd on replica {{ inventory_hostname }}"
  block:
    - name: Check etcd process status
      ansible.builtin.command: systemctl is-active etcd
      register: _etcd_active_replica
      changed_when: false
      retries: 5
      delay: 1
      until: _etcd_active_replica.rc == 0
      timeout: 30

    - name: Verify etcd health via HTTP
      ansible.builtin.shell: |
        curl -s http://127.0.0.1:2379/health >/dev/null 2>&1 && echo "ok" || echo "fail"
      args:
        executable: /bin/bash
      register: _etcd_health_replica
      until: _etcd_health_replica.stdout.strip() == "ok"
      retries: 5
      delay: 1
      timeout: 30

    - name: "DEBUG: etcd health on replica"
      ansible.builtin.debug:
        msg: |
          etcd service status: {{ _etcd_active_replica.rc == 0 | ternary('RUNNING', 'STOPPED') }}
          etcd HTTP health: {{ _etcd_health_replica.stdout.strip() | upper }}
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_replica'] | default([])) or
     inventory_hostname in (groups['standby_cluster_replica'] | default([])))

# --- REPLICA: Start Patroni and validate independently ---
- name: "Start Patroni on replica {{ inventory_hostname }}"
  block:
    - name: Start and enable Patroni service on replica
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true

    - name: Verify Patroni process is active on replica
      ansible.builtin.command: systemctl is-active patroni
      register: _patroni_active_replica
      changed_when: false
      retries: 5
      delay: 1
      until: _patroni_active_replica.rc == 0
      timeout: 30

    - name: "DEBUG: Patroni service status on replica"
      ansible.builtin.debug:
        msg: "Patroni service: RUNNING (rc={{ _patroni_active_replica.rc }})"
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_replica'] | default([])) or
     inventory_hostname in (groups['standby_cluster_replica'] | default([])))

# --- REPLICA: Validate Patroni REST API is responsive ---
- name: "Validate Patroni REST API on replica {{ inventory_hostname }}"
  block:
    - name: Wait for Patroni REST API to respond
      ansible.builtin.shell: |
        curl -s http://127.0.0.1:{{ patroni_restapi_port }}/cluster >/dev/null 2>&1 && echo "ok" || echo "fail"
      args:
        executable: /bin/bash
      register: _patroni_api_check
      until: _patroni_api_check.stdout.strip() == "ok"
      retries: 10
      delay: 1
      timeout: 30

    - name: "DEBUG: Patroni REST API status on replica"
      ansible.builtin.debug:
        msg: "Patroni REST API /cluster endpoint: {{ _patroni_api_check.stdout.strip() | upper }}"
  rescue:
    - name: Collect Patroni logs for diagnosis
      ansible.builtin.command: journalctl -u patroni -n 50 --no-pager
      register: _patroni_logs_replica
      changed_when: false
      failed_when: false

    - name: "DEBUG: Patroni service logs (after REST API failure on replica)"
      ansible.builtin.debug:
        msg: "{{ _patroni_logs_replica.stdout_lines }}"

    - name: Fail with diagnostic message
      ansible.builtin.fail:
        msg: "Patroni REST API not responding on replica {{ inventory_hostname }}. See logs above."
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_replica'] | default([])) or
     inventory_hostname in (groups['standby_cluster_replica'] | default([])))

# --- REPLICA: Validate PostgreSQL is running and replicating ---
- name: "Validate PostgreSQL on replica {{ inventory_hostname }}"
  block:
    - name: Check PostgreSQL connection and replication
      ansible.builtin.shell: |
        psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT version();" 2>&1
      args:
        executable: /bin/bash
      register: _pg_check_replica
      until: _pg_check_replica.stdout | length > 0 and "PostgreSQL" in _pg_check_replica.stdout
      retries: 10
      delay: 1
      timeout: 30
      become_user: postgres

    - name: "DEBUG: PostgreSQL version on replica"
      ansible.builtin.debug:
        msg: |
          PostgreSQL status on replica:
          {{ _pg_check_replica.stdout }}
  rescue:
    - name: Collect PostgreSQL logs on replica
      ansible.builtin.command: journalctl -u postgresql -n 30 --no-pager
      register: _pg_logs_replica
      changed_when: false
      failed_when: false

    - name: Collect Patroni logs on replica (PostgreSQL failure context)
      ansible.builtin.command: journalctl -u patroni -n 50 --no-pager
      register: _patroni_logs_pg_replica
      changed_when: false
      failed_when: false

    - name: "DEBUG: PostgreSQL startup failure on replica"
      ansible.builtin.debug:
        msg: |
          PostgreSQL failed to start on replica {{ inventory_hostname }}.

          PostgreSQL logs:
          {{ _pg_logs_replica.stdout_lines }}

          Patroni logs (for context):
          {{ _patroni_logs_pg_replica.stdout_lines }}

    - name: Fail if PostgreSQL not running on replica
      ansible.builtin.fail:
        msg: |
          PostgreSQL failed to start on replica {{ inventory_hostname }}.
          Check logs above for details.
  when: >
    (pg_cluster_activate_services | default(true) | bool) and
    (inventory_hostname in (groups['primary_cluster_replica'] | default([])) or
     inventory_hostname in (groups['standby_cluster_replica'] | default([])))
