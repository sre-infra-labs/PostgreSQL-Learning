---
- name: Create /etc/patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    mode: "0750"

- name: Generate /etc/patroni/patroni.yml from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.yml.j2"
    dest: /etc/patroni/patroni.yml
    mode: "0640"
  notify: restart patroni

# ---------------------------------------------------------------------------
# PATRONICTL_CONFIG_FILE — set across all shell entry points:
#   /etc/environment          → PAM / systemd services
#   /etc/profile.d/           → login shells (ssh, su -, bash --login)
#   /root/.bashrc             → interactive docker exec sessions as root
#   postgresql_home_dir/.bashrc → interactive docker exec sessions as postgres
#
# Note: /etc/bash.bashrc is NOT used — Ubuntu's default has [ -z "$PS1" ] && return
# at the top, so it exits early in non-interactive shells (e.g. bash -c "...").
# ---------------------------------------------------------------------------
- name: Set PATRONICTL_CONFIG_FILE in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE for login shells (all users)
  ansible.builtin.copy:
    dest: /etc/profile.d/patroni-env.sh
    content: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml\n"
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE in root .bashrc
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE in postgres .bashrc
  ansible.builtin.lineinfile:
    path: "{{ postgresql_home_dir }}/.bashrc"
    line: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    owner: postgres
    group: postgres
    mode: "0640"

- name: Create Patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    state: directory
    mode: "0750"

- name: Deploy Patroni systemd service file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.service.j2"
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: reload systemd daemon

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    state: directory
    mode: "0700"

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    mode: "0700"

- name: Check if PostgreSQL data directory is empty
  ansible.builtin.shell: "ls -A {{ postgresql_data_dir }} 2>/dev/null"
  register: _pg_data_contents
  changed_when: false

- name: Fail if data directory is not empty before init
  ansible.builtin.fail:
    msg: "Data directory {{ postgresql_data_dir }} is not empty. Please use -e reinit_cluster=true to clean up an existing cluster."
  when:
    - _pg_data_contents.stdout is defined
    - _pg_data_contents.stdout | length > 0
    - not (reinit_cluster | default(false) | bool)

- name: Create PostgreSQL stats temp directory
  ansible.builtin.file:
    path: "{{ postgresql_stats_temp_directory_path }}"
    state: directory
    mode: "0750"

- name: Create PostgreSQL archive directory
  ansible.builtin.file:
    path: "{{ postgresql_data_archive }}"
    state: directory
    mode: "0700"

- name: Create PostgreSQL scripts directory
  ansible.builtin.file:
    path: "{{ postgresql_scripts_dir }}"
    state: directory
    mode: "0744"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Check if postgres OS user exists
  ansible.builtin.command: id postgres
  register: postgres_user_check
  changed_when: false
  failed_when: false

- name: Fix directory ownership for postgres user (Docker compatibility)
  ansible.builtin.shell: chown -R postgres:postgres "{{ item }}"
  loop:
    - /etc/patroni
    - "{{ patroni_log_dir }}"
    - "{{ postgresql_log_dir }}"
    - "{{ postgresql_data_dir | dirname }}"   # /var/lib/postgresql/<version>/ — parent dir must be traversable by postgres
    - "{{ postgresql_data_dir }}"
    - "{{ postgresql_stats_temp_directory_path }}"
    - "{{ postgresql_data_archive }}"
  changed_when: false
  when: postgres_user_check.rc == 0

- name: Ensure locales package is installed
  ansible.builtin.package:
    name: locales
    state: present

- name: Generate {{ postgresql_locale }} locale
  ansible.builtin.command: locale-gen {{ postgresql_locale }}
  changed_when: true

# --- Start Patroni on Leader first, then Replicas ---

- name: Start Patroni on Leader (initializes the cluster)
  block:
    - name: Start and enable Patroni service on leader
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true

    - name: Verify Patroni process is active on leader (catch early crashes fast)
      ansible.builtin.command: systemctl is-active patroni
      register: _patroni_active_leader
      changed_when: false
      retries: 6
      delay: 5
      until: _patroni_active_leader.rc == 0

    - name: Wait for Patroni REST API to become available on leader
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "127.0.0.1"
        state: started
        timeout: 120
        delay: 5

    - name: Wait for leader to be elected
      ansible.builtin.uri:
        # Primary leaders respond on /primary; standby leaders respond on /standby-leader
        url: "http://{{ ip }}:{{ patroni_restapi_port }}/{{ 'standby-leader' if inventory_hostname in (groups['standby_cluster_leader'] | default([])) else 'primary' }}"
        method: GET
        status_code: 200
      register: leader_check
      until: leader_check.status == 200
      retries: 30
      delay: 5
  rescue:
    - name: Collect Patroni journal logs for diagnosis (leader)
      ansible.builtin.command: journalctl -u patroni -n 80 --no-pager
      register: _patroni_journal_leader
      changed_when: false
      failed_when: false

    - name: Show Patroni journal logs (leader)
      ansible.builtin.debug:
        var: _patroni_journal_leader.stdout_lines

    - name: Fail with diagnostic message (leader)
      ansible.builtin.fail:
        msg: "Patroni failed to start on leader {{ inventory_hostname }}. Review journal logs above."
  when: >
    inventory_hostname in (groups['primary_cluster_leader'] | default([])) or
    inventory_hostname in (groups['standby_cluster_leader'] | default([]))

- name: Start Patroni on Replicas (stream from leader)
  block:
    - name: Start and enable Patroni service on replicas
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true

    - name: Verify Patroni process is active on replicas (catch early crashes fast)
      ansible.builtin.command: systemctl is-active patroni
      register: _patroni_active_replica
      changed_when: false
      retries: 6
      delay: 5
      until: _patroni_active_replica.rc == 0

    - name: Wait for Patroni REST API to become available on replica
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "127.0.0.1"
        state: started
        timeout: 300
        delay: 5
  rescue:
    - name: Collect Patroni journal logs for diagnosis (replica)
      ansible.builtin.command: journalctl -u patroni -n 80 --no-pager
      register: _patroni_journal_replica
      changed_when: false
      failed_when: false

    - name: Show Patroni journal logs (replica)
      ansible.builtin.debug:
        var: _patroni_journal_replica.stdout_lines

    - name: Fail with diagnostic message (replica)
      ansible.builtin.fail:
        msg: "Patroni failed to start on replica {{ inventory_hostname }}. Review journal logs above."
  when: >
    inventory_hostname in (groups['primary_cluster_replica'] | default([])) or
    inventory_hostname in (groups['standby_cluster_replica'] | default([]))
