---
- name: Inside pg_cluster/tasks/main.yml
  ansible.builtin.debug:
    msg: "Installing PostgreSQL {{ postgresql_version }} cluster with Patroni + etcd + pgbackrest + pgbouncer"

- name: Include defaults/creds.yml
  include_vars:
    file: "{{ role_path }}/defaults/creds.yml"
  tags: always

- name: Confirm before reinitializing cluster
  ansible.builtin.pause:
    prompt: "WARNING: Reinitializing the cluster will delete all data. Type 'yes' to continue:"
  register: reinit_confirmation
  when:
    - reinit_cluster is defined and reinit_cluster | bool
    - not (skip_confirm is defined and skip_confirm | bool)
  delegate_to: localhost
  run_once: true

- name: Abort if user did not confirm reinit
  ansible.builtin.fail:
    msg: "Cluster reinitialization aborted by user."
  when:
    - reinit_cluster is defined and reinit_cluster | bool
    - not (skip_confirm is defined and skip_confirm | bool)
    - reinit_confirmation.user_input | default('') != "yes"

- name: Run prechecks
  include_tasks:
    file: custom/prechecks.yml
    apply:
      tags: prechecks
  tags: prechecks

- name: Setup PGDG repository
  include_tasks:
    file: custom/repository.yml
    apply:
      tags: repository
  tags: repository

- name: Install packages
  include_tasks:
    file: custom/packages.yml
    apply:
      tags: packages
  tags: packages

- name: Configure .pgpass
  include_tasks:
    file: custom/pgpass.yml
    apply:
      tags: pgpass
  tags: pgpass

- name: Install and configure etcd (inside container, 3-member cluster)
  include_tasks:
    file: custom/etcd.yml
    apply:
      tags: etcd
  tags: etcd

- name: Install and configure Patroni
  include_tasks:
    file: custom/patroni.yml
    apply:
      tags: patroni
  tags: patroni

- name: Create standby cluster replication slot on primary
  # Patroni has already started PostgreSQL above, so the socket is available.
  # Only runs during the standby cluster playbook (inventory_hostname in standby_cluster).
  # Delegates to pg1 so the physical slot exists on the primary before pg4 starts streaming.
  # Idempotent — skips silently if the slot already exists.
  become_user: postgres
  ansible.builtin.shell: |
    psql -U postgres -tAc "
      SELECT pg_create_physical_replication_slot('{{ patroni_standby_primary_slot_name }}', true, false)
      WHERE NOT EXISTS (
        SELECT 1 FROM pg_replication_slots WHERE slot_name = '{{ patroni_standby_primary_slot_name }}'
      );"
  register: _slot_create
  changed_when: _slot_create.stdout | trim != ''
  failed_when: _slot_create.rc != 0
  delegate_to: "{{ groups['primary_cluster_leader'] | first }}"
  run_once: true
  when:
    - inventory_hostname in groups['standby_cluster']
  tags: patroni

- name: Configure pgBackRest
  include_tasks:
    file: custom/pgbackrest.yml
    apply:
      tags: pgbackrest
  tags: pgbackrest

- name: Install and configure pgBouncer
  include_tasks:
    file: custom/pgbouncer.yml
    apply:
      tags: pgbouncer
  tags: pgbouncer

- name: Install pg_exporter
  include_tasks:
    file: custom/pg_exporter.yml
    apply:
      tags: pg_exporter
  tags: pg_exporter

- name: Create application database and users
  include_tasks:
    file: custom/user.yml
    apply:
      tags: users
  tags: users

- name: Install and configure HAProxy
  include_tasks:
    file: custom/haproxy.yml
    apply:
      tags: haproxy
  tags: haproxy

- name: Install and configure Keepalived
  include_tasks:
    file: custom/keepalived.yml
    apply:
      tags: keepalived
  tags: keepalived

- name: Show Patroni cluster status
  include_tasks:
    file: custom/patronictl_list.yml
    apply:
      tags: patronictl_list
  tags: patronictl_list
  when: >-
    inventory_hostname in groups['primary_cluster_leader'] or
    inventory_hostname in groups['standby_cluster_leader']
