---
- name: Build list of active standby containers from inventory
  ansible.builtin.set_fact:
    active_standby_containers: "{{ standby_containers | selectattr('name', 'in', groups['standby_cluster']) | list }}"

- name: Fail if no standby cluster hosts are enabled in hosts.yml
  ansible.builtin.fail:
    msg: >
      No hosts found in the 'standby_cluster' inventory group.
      Run with: ansible-playbook -i hosts.yml playbook-setup-standby-docker.yml
  when: active_standby_containers | length == 0

- name: Read SSH public key from local machine
  ansible.builtin.slurp:
    src: "{{ ansible_ssh_public_key_path | expanduser }}"
  register: ssh_pub_key

- name: Create per-node PostgreSQL data volumes (standby)
  community.docker.docker_volume:
    name: "{{ pg_data_volume_prefix }}-{{ item.name }}"
    state: present
  loop: "{{ active_standby_containers }}"

- name: Create per-node PostgreSQL log volumes (standby)
  community.docker.docker_volume:
    name: "{{ pg_log_volume_prefix }}-{{ item.name }}"
    state: present
  loop: "{{ active_standby_containers }}"

- name: Create PostgreSQL standby node containers
  community.docker.docker_container:
    name: "{{ item.name }}"
    image: "{{ pg_node_image }}"
    state: started
    restart_policy: unless-stopped
    privileged: true
    cgroupns_mode: host
    dns_servers:
      - 8.8.8.8
      - 1.1.1.1
    tmpfs:
      - /run
      - /run/lock
    networks:
      - name: "{{ docker_network_name }}"
        ipv4_address: "{{ item.ip }}"
    ports:
      - "{{ item.ssh_port }}:22"
      - "{{ item.pg_port }}:5432"
      - "{{ item.patroni_port }}:8008"
      - "{{ item.pg_exporter_port }}:9194"
      - "{{ item.haproxy_write_port }}:5000"
      - "{{ item.haproxy_read_port }}:5001"
      - "{{ item.haproxy_stats_port }}:7000"
    volumes:
      - "{{ pg_data_volume_prefix }}-{{ item.name }}:/var/lib/postgresql"
      - "{{ pg_log_volume_prefix }}-{{ item.name }}:/var/log"
      - "{{ pg_backup_volume }}:/var/lib/pgbackrest"
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    hostname: "{{ item.name }}"
  loop: "{{ active_standby_containers }}"

- name: Inject SSH public key into standby containers
  ansible.builtin.shell: |
    docker exec {{ item.name }} bash -c "
      mkdir -p /home/ansible/.ssh
      chmod 700 /home/ansible/.ssh
      echo '{{ ssh_pub_key.content | b64decode | trim }}' >> /home/ansible/.ssh/authorized_keys
      sort -u /home/ansible/.ssh/authorized_keys -o /home/ansible/.ssh/authorized_keys
      chmod 600 /home/ansible/.ssh/authorized_keys
      chown -R ansible:ansible /home/ansible/.ssh
    "
  loop: "{{ active_standby_containers }}"
  changed_when: true

- name: Wait for SSH to be available on standby containers
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item.ssh_port }}"
    state: started
    timeout: 90
    delay: 3
  loop: "{{ active_standby_containers }}"

- name: Standby container connectivity summary
  ansible.builtin.debug:
    msg:
      - "{{ item.name }} | IP: {{ item.ip }}"
      - "  SSH:           localhost:{{ item.ssh_port }}"
      - "  PostgreSQL:    localhost:{{ item.pg_port }}"
      - "  Patroni:       localhost:{{ item.patroni_port }}"
      - "  pg_exporter:   localhost:{{ item.pg_exporter_port }}"
      - "  HAProxy write: localhost:{{ item.haproxy_write_port }}"
      - "  HAProxy read:  localhost:{{ item.haproxy_read_port }}"
      - "  HAProxy stats: localhost:{{ item.haproxy_stats_port }}"
  loop: "{{ active_standby_containers }}"
