---
# Container name = inventory_hostname (e.g., docpg-cls1-pg4)
# IP            = hostvars[<name>].ip  (defined in hosts.yml)
# No host port mappings — Ansible uses community.docker.docker connection plugin.

- name: Fail if no standby cluster hosts are enabled in hosts.yml
  ansible.builtin.fail:
    msg: >
      No hosts found in the 'standby_cluster' inventory group.
      Run with: ansible-playbook -i hosts.yml playbook-setup-standby-cluster-containers.yml
  when: groups['standby_cluster'] | default([]) | length == 0

- name: Create per-node PostgreSQL data volumes (standby)
  community.docker.docker_volume:
    name: "{{ pg_data_volume_prefix }}-{{ item }}"
    state: present
  loop: "{{ groups['standby_cluster'] }}"

- name: Create per-node PostgreSQL log volumes (standby)
  community.docker.docker_volume:
    name: "{{ pg_log_volume_prefix }}-{{ item }}"
    state: present
  loop: "{{ groups['standby_cluster'] }}"

- name: Create PostgreSQL standby node containers
  community.docker.docker_container:
    name: "{{ item }}"
    image: "{{ pg_node_image }}"
    state: started
    restart_policy: unless-stopped
    privileged: true
    cgroupns_mode: host
    dns_servers:
      - 8.8.8.8
      - 1.1.1.1
    tmpfs:
      - /run
      - /run/lock
    networks:
      - name: "{{ docker_network }}"
        ipv4_address: "{{ hostvars[item].ip }}"
    volumes:
      - "{{ pg_data_volume_prefix }}-{{ item }}:/var/lib/postgresql"
      - "{{ pg_log_volume_prefix }}-{{ item }}:/var/log"
      - "{{ pg_backup_volume }}:/var/lib/pgbackrest"
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    hostname: "{{ item }}"
  loop: "{{ groups['standby_cluster'] }}"

- name: Wait for standby containers to be reachable via docker exec
  ansible.builtin.command: docker exec {{ item }} true
  loop: "{{ groups['standby_cluster'] }}"
  register: docker_exec_check
  retries: 30
  delay: 2
  until: docker_exec_check.rc == 0
  changed_when: false

- name: Standby container connectivity summary
  ansible.builtin.debug:
    msg:
      - "{{ item }} | IP: {{ hostvars[item].ip }}"
      - "  PostgreSQL    (in-container): {{ hostvars[item].ip }}:5432"
      - "  Patroni REST  (in-container): {{ hostvars[item].ip }}:8008"
      - "  pg_exporter   (in-container): {{ hostvars[item].ip }}:9194"
      - "  HAProxy write (in-container): {{ hostvars[item].ip }}:5000"
      - "  HAProxy read  (in-container): {{ hostvars[item].ip }}:5001"
      - "  HAProxy stats (in-container): {{ hostvars[item].ip }}:7000"
      - "  Access from Mac host: docker exec {{ item }} <command>"
  loop: "{{ groups['standby_cluster'] }}"
