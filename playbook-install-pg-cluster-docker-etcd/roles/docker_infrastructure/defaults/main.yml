# Docker network — sourced from hosts.yml (all.vars: docker_network, docker_network_subnet).
# The playbook will NOT recreate this network; it attaches pg containers to it.
# Values below are fallback defaults only; hosts.yml takes precedence.
docker_network: "lab-network"
docker_network_subnet: "172.18.0.0/16"
docker_network_driver: "bridge"

# Container image — built from Dockerfile in the project root
pg_node_image: "pg-cluster-node:latest"
pg_node_dockerfile_path: "{{ playbook_dir }}"

# etcd runs INSIDE each pg container (no separate etcd container)
# etcd forms a 3-member cluster using container IPs over the Docker network
# Ports 2379 (client) and 2380 (peer) are container-internal only

# Keepalived VIPs — float inside the Docker bridge network
keepalived_vip: "172.18.0.10"          # primary/write VIP → Patroni leader
keepalived_replica_vip: "172.18.0.9"   # replica/standby VIP → sync standby or healthy replica

# PostgreSQL node containers
# Container name and IP are taken from hosts.yml (inventory_hostname + 'ip' hostvar).
# No host port mappings — Ansible reaches each container via `docker exec` using the
# community.docker.docker connection plugin (see hosts.yml). All inter-component
# traffic (PostgreSQL :5432, Patroni REST :8008, HAProxy :5000/:5001/:7000,
# pg_exporter :9194, etcd :2379/:2380) stays inside {{ docker_network }}.

# Docker named volumes
pg_data_volume_prefix: "pg-data"
pg_log_volume_prefix: "pg-logs"
pg_backup_volume: "pg-backups"
