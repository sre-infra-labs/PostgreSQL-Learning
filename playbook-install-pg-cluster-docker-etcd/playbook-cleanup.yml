---
# Cleanup playbook — tears down the PostgreSQL Docker cluster so the full setup
# can be run again from scratch. Designed for repeated learning / testing cycles.
#
# NOTE: The Docker network (docker_network from hosts.yml) is a SHARED network used
# by other lab containers (postgres, mongo, cadvisor, etc.) and is NEVER removed by
# this playbook. Only pg cluster containers and volumes are cleaned up.
#
# USAGE
# ─────
# Standard cleanup (containers + volumes, keeps image + network):
#   ansible-playbook -i hosts.yml playbook-cleanup.yml
#
# Skip the confirmation prompt (for scripting / full cycle):
#   ansible-playbook -i hosts.yml playbook-cleanup.yml -e skip_confirm=true
#
# Also remove the Docker image (forces a full image rebuild on next run):
#   ansible-playbook -i hosts.yml playbook-cleanup.yml -e remove_image=true
#
# Selective cleanup using tags:
#   ansible-playbook -i hosts.yml playbook-cleanup.yml --tags containers  # only containers
#   ansible-playbook -i hosts.yml playbook-cleanup.yml --tags volumes     # only volumes
#   ansible-playbook -i hosts.yml playbook-cleanup.yml --tags image       # only image
#
# Full cycle (cleanup → infra → install) in one command:
#   ansible-playbook -i hosts.yml playbook-cleanup.yml -e skip_confirm=true && \
#   ansible-playbook -i hosts.yml playbook-setup-primary-cluster-containers.yml && \
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass

- name: Cleanup Docker PostgreSQL Cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- what to clean (override with -e) ---
    remove_containers: true    # stop + remove all pg cluster containers + pg-bouncer
    remove_volumes:    true    # remove all named Docker volumes (pg-data-*, pg-logs-*, pg-backups)
    remove_image:      false   # remove pg-cluster-node:latest (slow to rebuild — off by default)
    skip_confirm:      false   # set true to bypass the confirmation prompt

    # NOTE: remove_network is intentionally absent.
    # docker_network (from hosts.yml) is a SHARED network used by other containers
    # (postgres, mongo, cadvisor…) and must NEVER be removed. The pg containers are
    # simply detached when removed.

    # --- derived from inventory groups in hosts.yml ---
    # Must be invoked with `-i hosts.yml` so primary_cluster / standby_cluster are resolved.
    _pg_nodes: "{{ (groups['primary_cluster'] | default([])) + (groups['standby_cluster'] | default([])) }}"
    _all_containers: "{{ _pg_nodes + ['pg-bouncer'] }}"
    _all_volumes: "{{ (_pg_nodes | map('regex_replace', '^', 'pg-data-') | list)
                       + (_pg_nodes | map('regex_replace', '^', 'pg-logs-') | list)
                       + ['pg-backups'] }}"

    _docker_image:   "pg-cluster-node:latest"
    # docker_network intentionally excluded — it is shared with other lab containers

  pre_tasks:
    - name: Show cleanup plan
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  PostgreSQL Docker Cluster — Cleanup Plan"
          - "======================================================"
          - "  Containers  : {{ _all_containers | join(', ') }}"
          - "  Volumes     : {{ _all_volumes | join(', ') }}"
          - "  Image       : {{ _docker_image }}  (remove={{ remove_image }})"
          - "  Network     : {{ hostvars[groups['primary_cluster'][0]]['docker_network'] | default('lab-network') }} (never removed — shared with other lab containers)"
          - "======================================================"

    - name: Confirm destructive cleanup
      ansible.builtin.pause:
        prompt: |
          WARNING: This will permanently delete all containers and data volumes.
          Type 'yes' to continue, anything else to abort
      register: _confirm
      when: not (skip_confirm | bool)

    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Cleanup aborted."
      when:
        - not (skip_confirm | bool)
        - _confirm.user_input | lower != 'yes'

  tasks:

    # ------------------------------------------------------------------ #
    #  CONTAINERS                                                          #
    # ------------------------------------------------------------------ #
    - name: Stop containers
      ansible.builtin.command: docker stop {{ item }}
      loop: "{{ _all_containers }}"
      ignore_errors: true
      changed_when: false
      tags: containers
      when: remove_containers | bool

    - name: Remove containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        force_kill: true
      loop: "{{ _all_containers }}"
      ignore_errors: true
      tags: containers
      when: remove_containers | bool

    - name: Containers removed
      ansible.builtin.debug:
        msg: "Containers removed: {{ _all_containers | join(', ') }}"
      tags: containers
      when: remove_containers | bool

    # ------------------------------------------------------------------ #
    #  VOLUMES                                                             #
    # ------------------------------------------------------------------ #
    - name: Remove Docker named volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: absent
      loop: "{{ _all_volumes }}"
      ignore_errors: true
      tags: volumes
      when: remove_volumes | bool

    - name: Volumes removed
      ansible.builtin.debug:
        msg: "Volumes removed: {{ _all_volumes | join(', ') }}"
      tags: volumes
      when: remove_volumes | bool

    # ------------------------------------------------------------------ #
    #  IMAGE (optional — slow to rebuild, skipped by default)             #
    # ------------------------------------------------------------------ #
    - name: Remove pg-cluster-node Docker image
      community.docker.docker_image:
        name: "{{ _docker_image }}"
        state: absent
        force_absent: true
      ignore_errors: true
      tags: image
      when: remove_image | bool

    - name: Image removed
      ansible.builtin.debug:
        msg: "Image '{{ _docker_image }}' removed — will be rebuilt on next Phase 1 run"
      tags: image
      when: remove_image | bool

  post_tasks:
    - name: Cleanup complete — ready for a fresh setup run
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  Cleanup done!  Run the setup again with:"
          - ""
          - "  Step 1 — Docker infra:"
          - "    ansible-playbook playbook-setup-docker.yml"
          - ""
          - "  Step 2 — PG cluster install:"
          - "    ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"
          - ""
          - "  Or run all three steps in one command:"
          - "    ansible-playbook playbook-cleanup.yml -e skip_confirm=true &&"
          - "    ansible-playbook playbook-setup-docker.yml &&"
          - "    ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"
          - "======================================================"
