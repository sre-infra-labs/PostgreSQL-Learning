---
- name: Setup Docker Infrastructure for PostgreSQL Primary Cluster
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/dba_vars.yml
  collections:
    - community.docker

  pre_tasks:
    - name: Starting Docker Infrastructure Setup (Primary Cluster)
      ansible.builtin.debug:
        msg: "Setting up Docker infrastructure for primary cluster: {{ groups['primary_cluster'] | default([]) | join(', ') }} (Patroni + etcd)"

  roles:
    - role: roles/docker_infrastructure

  post_tasks:
    - name: Docker Infrastructure Setup Completed
      ansible.builtin.debug:
        msg:
          - "Docker infrastructure is ready!"
          - "Containers (no host port mappings — reach them via `docker exec <name>`):"
          - "{% for h in groups['primary_cluster'] | default([]) %}  {{ h }} => IP {{ hostvars[h].ip }} | PG:5432 | Patroni:8008 | pgBouncer:6432 | HAProxy write:5000 read:5001 stats:7000{% if not loop.last %}\n{% endif %}{% endfor %}"
          - "  etcd (inside each container) => client :2379, peer :2380"
          - "  Keepalived VIP => {{ keepalived_vip }} (follows Patroni primary)"
          - ""
          - "Next: ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"

# ansible-playbook -i hosts.yml playbook-setup-primary-cluster-containers.yml
# ansible-playbook -i hosts.yml playbook-setup-primary-cluster-containers.yml --tags network     # only network
# ansible-playbook -i hosts.yml playbook-setup-primary-cluster-containers.yml --tags containers  # containers only
