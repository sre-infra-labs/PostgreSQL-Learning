---
- name: Setup Docker Infrastructure for PostgreSQL Standby Cluster
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/dba_vars.yml
  vars:
    setup_standby: true
  collections:
    - community.docker

  pre_tasks:
    - name: Starting Docker Infrastructure Setup (Standby Cluster)
      ansible.builtin.debug:
        msg: "Setting up Docker infrastructure for standby PostgreSQL cluster: {{ groups['standby_cluster'] | default([]) | join(', ') }}"

  roles:
    - role: roles/docker_infrastructure

  post_tasks:
    - name: Docker Infrastructure Setup Completed (Standby Cluster)
      ansible.builtin.debug:
        msg:
          - "Standby Docker infrastructure is ready!"
          - "Containers (no host port mappings — reach them via `docker exec <name>`):"
          - "{% for h in groups['standby_cluster'] | default([]) %}  {{ h }} => IP {{ hostvars[h].ip }} | PG:5432 | Patroni:8008 | pgBouncer:6432 | HAProxy write:5000 read:5001 stats:7000{% if not loop.last %}\n{% endif %}{% endfor %}"
          - ""
          - "Next: ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass"

# ansible-playbook -i hosts.yml playbook-setup-standby-cluster-containers.yml
# ansible-playbook -i hosts.yml playbook-setup-standby-cluster-containers.yml --tags standby_containers  # containers only
