---
# Standby Cluster Playbook
# Installs pg4 as a single-node standby cluster in Region B
# Same cluster name as primary (pg-docker-cls1) to enable failover/failback
# pg4 streams from primary cluster leader (pg1 or pg2) via standby_cluster configuration

- name: Install PostgreSQL 18 Standby Cluster in Docker container (pg4)
  hosts: standby
  become: true
  become_user: root
  gather_facts: true
  vars_files:
    - sensitive-values
    - vars/dba_vars.yml
  collections:
    - community.postgresql

  pre_tasks:
    - name: Starting PostgreSQL Standby Cluster Installation
      ansible.builtin.debug:
        msg: "Installing PostgreSQL 18 standby cluster (pg4) with Patroni streaming from primary"

  roles:
    - role: roles/pg_cluster

  post_tasks:
    - name: PostgreSQL Standby Cluster Installation Completed
      ansible.builtin.debug:
        msg: "PostgreSQL 18 standby cluster installation completed!"

# Usage:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass
#
# Install only specific components on standby:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass --tags patroni
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass --tags pgbouncer
#
# Reinitialize standby cluster:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass -e reinit_cluster=true
