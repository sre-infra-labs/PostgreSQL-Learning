# PostgreSQL Configuration for CDC with Debezium
# Generated by Ansible

# Connection Settings
max_connections = {{ pg_max_connections }}
listen_addresses = '*'

# Memory Settings
shared_buffers = {{ pg_shared_buffers }}
effective_cache_size = {{ pg_effective_cache_size }}
maintenance_work_mem = {{ pg_maintenance_work_mem }}

# WAL Configuration (Critical for CDC)
wal_level = {{ pg_wal_level }}
max_wal_senders = {{ pg_max_wal_senders }}
wal_keep_size = {{ pg_wal_keep_size }}
hot_standby = {{ pg_hot_standby }}

# WAL Performance
checkpoint_completion_target = {{ pg_checkpoint_completion_target }}
wal_buffers = {{ pg_wal_buffers }}

# Logging (helpful for debugging)
log_statement = 'all'
log_duration = on
log_min_duration_statement = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# TCP/IP Settings
tcp_keepalives_idle = 300
tcp_keepalives_interval = 30
tcp_keepalives_count = 5
