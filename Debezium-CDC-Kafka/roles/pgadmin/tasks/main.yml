---
- name: pgAdmin Deployment
  block:
    - name: Check pgAdmin container state
      shell: |
        docker inspect --format='{{ "{{" }}.State.Status{{ "}}" }}' "{{ pgadmin_container_name }}" 2>/dev/null || echo "missing"
      register: pgadmin_state
      failed_when: false
      changed_when: false

    - name: Deploy pgAdmin container (if missing)
      shell: |
        docker run -d \
          --name "{{ pgadmin_container_name }}" \
          --network "{{ docker_network_name }}" \
          --ip "{{ pgadmin_container_ip }}" \
          -p "{{ pgadmin_host_mapping_port }}:{{ pgadmin_listen_port }}" \
          -e PGADMIN_DEFAULT_EMAIL="{{ PGADMIN_DEFAULT_EMAIL }}" \
          -e PGADMIN_DEFAULT_PASSWORD="{{ PGADMIN_DEFAULT_PASSWORD }}" \
          -v "{{ docker_volumes_root }}/pgadmin:/var/lib/pgadmin" \
          dpage/pgadmin4:{{ pgadmin_version }}
      when: pgadmin_state.stdout | trim == 'missing'

    - name: Start stopped pgAdmin container (if exited)
      shell: docker start "{{ pgadmin_container_name }}"
      when: pgadmin_state.stdout | trim in ['exited', 'created', 'paused']

    - name: Wait for pgAdmin container to be running
      pause:
        seconds: 10

    - name: Display pgAdmin deployment status
      ansible.builtin.debug:
        msg: |
          ✓ pgAdmin deployed successfully
          Container: {{ pgadmin_container_name }}
          IP: {{ pgadmin_container_ip }}:{{ pgadmin_listen_port }}
          Exposed Port: localhost:{{ pgadmin_host_mapping_port }}
          URL: http://localhost:{{ pgadmin_host_mapping_port }}
          Email: {{ PGADMIN_DEFAULT_EMAIL }}
          Note: Run the pgBadger playbook to enable Log Analysis portal
