---
# Inventory for Debezium CDC Learning Infrastructure
# All services run as Docker containers on localhost (Mac/Linux)

all:
  vars:
    ansible_host: localhost
    ansible_connection: local
    ansible_become: false

  children:
    # Docker infrastructure group
    docker_infra:
      hosts:
        docker_host:
          ansible_host: localhost

    # Zookeeper service
    zookeeper:
      hosts:
        zk_node:
          container_name: "zk-cdc"
          container_ip: "172.20.0.2"

    # Kafka broker service
    kafka_brokers:
      hosts:
        kafka_broker_1:
          container_name: "kafka-cdc"
          container_ip: "172.20.0.3"

    # PostgreSQL source database (CDC source)
    postgres_source:
      hosts:
        postgres_src:
          container_name: "postgres-cdc"
          container_ip: "172.20.0.4"

    # Debezium connect service
    debezium:
      hosts:
        debezium_connect:
          container_name: "debezium-connect"
          container_ip: "172.20.0.5"

    # pgAdmin for database management and pgBadger
    pgadmin:
      hosts:
        pgadmin_server:
          container_name: "pgadmin4-cdc"
          container_ip: "172.20.0.6"

    # Kafka UI for monitoring
    kafka_ui:
      hosts:
        kafka_ui_server:
          container_name: "kafka-ui-cdc"
          container_ip: "172.20.0.7"
