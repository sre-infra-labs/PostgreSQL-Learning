---
- name: Read SSH public key from local machine
  ansible.builtin.slurp:
    src: "{{ ansible_ssh_public_key_path | expanduser }}"
  register: ssh_pub_key

- name: Create per-node PostgreSQL data volumes
  community.docker.docker_volume:
    name: "{{ pg_data_volume_prefix }}-{{ item.name }}"
    state: present
  loop: "{{ pg_containers }}"

- name: Create per-node PostgreSQL log volumes
  community.docker.docker_volume:
    name: "{{ pg_log_volume_prefix }}-{{ item.name }}"
    state: present
  loop: "{{ pg_containers }}"

- name: Create shared pgbackrest backup volume
  community.docker.docker_volume:
    name: "{{ pg_backup_volume }}"
    state: present

- name: Create PostgreSQL node containers
  community.docker.docker_container:
    name: "{{ item.name }}"
    image: "{{ pg_node_image }}"
    state: started
    restart_policy: unless-stopped
    privileged: true
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
    networks:
      - name: "{{ docker_network_name }}"
        ipv4_address: "{{ item.ip }}"
    ports:
      - "{{ item.ssh_port }}:22"
      - "{{ item.pg_port }}:5432"
      - "{{ item.patroni_port }}:8008"
      - "{{ item.pg_exporter_port }}:9194"
      - "{{ item.pgbouncer_port }}:6432"
      - "{{ item.haproxy_write_port }}:5000"
      - "{{ item.haproxy_read_port }}:5001"
      - "{{ item.haproxy_stats_port }}:7000"
    volumes:
      - "{{ pg_data_volume_prefix }}-{{ item.name }}:/var/lib/postgresql"
      - "{{ pg_log_volume_prefix }}-{{ item.name }}:/var/log"
      - "{{ pg_backup_volume }}:/var/lib/pgbackrest"
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    hostname: "{{ item.name }}"
  loop: "{{ pg_containers }}"

- name: Inject SSH public key into containers
  ansible.builtin.shell: |
    docker exec {{ item.name }} bash -c "
      mkdir -p /home/ansible/.ssh
      chmod 700 /home/ansible/.ssh
      echo '{{ ssh_pub_key.content | b64decode | trim }}' >> /home/ansible/.ssh/authorized_keys
      sort -u /home/ansible/.ssh/authorized_keys -o /home/ansible/.ssh/authorized_keys
      chmod 600 /home/ansible/.ssh/authorized_keys
      chown -R ansible:ansible /home/ansible/.ssh
    "
  loop: "{{ pg_containers }}"
  changed_when: true

- name: Wait for SSH to be available on all containers
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item.ssh_port }}"
    state: started
    timeout: 90
    delay: 3
  loop: "{{ pg_containers }}"

- name: Container connectivity summary
  ansible.builtin.debug:
    msg:
      - "{{ item.name }} | IP: {{ item.ip }}"
      - "  SSH:           localhost:{{ item.ssh_port }}"
      - "  PostgreSQL:    localhost:{{ item.pg_port }}"
      - "  Patroni:       localhost:{{ item.patroni_port }}"
      - "  pg_exporter:   localhost:{{ item.pg_exporter_port }}"
      - "  pgBouncer:     localhost:{{ item.pgbouncer_port }}"
      - "  HAProxy write: localhost:{{ item.haproxy_write_port }} (primary only)"
      - "  HAProxy read:  localhost:{{ item.haproxy_read_port }}  (replicas)"
      - "  HAProxy stats: localhost:{{ item.haproxy_stats_port }} (HTTP UI)"
  loop: "{{ pg_containers }}"
