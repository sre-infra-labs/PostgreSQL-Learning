---
- name: Create /etc/patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Generate /etc/patroni/patroni.yml from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.yml.j2"
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart patroni

- name: Create Patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0750"

- name: Patch Patroni systemd service — config path
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/patroni.service
    regexp: '^(\s*)ConditionPathExists=.*$'
    line: '\1ConditionPathExists=/etc/patroni/patroni.yml'
    backrefs: yes
    backup: yes
  notify: reload systemd daemon

- name: Patch Patroni systemd service — ExecStart path
  ansible.builtin.lineinfile:
    path: /usr/lib/systemd/system/patroni.service
    regexp: '^(\s*)ExecStart=(.+patroni)\s+.*$'
    line: '\1ExecStart=\2 /etc/patroni/patroni.yml'
    backrefs: yes
  notify: reload systemd daemon

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"

- name: Ensure data directory is empty before init
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: "{{ item }}"
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - absent
    - directory

- name: Create PostgreSQL stats temp directory
  ansible.builtin.file:
    path: "{{ postgresql_stats_temp_directory_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create PostgreSQL archive directory
  ansible.builtin.file:
    path: "{{ postgresql_data_archive }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0700"

- name: Create PostgreSQL scripts directory
  ansible.builtin.file:
    path: "{{ postgresql_scripts_dir }}"
    owner: postgres
    group: postgres
    state: directory
    mode: "0744"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

# --- Start Patroni on Leader first, then Replicas ---

- name: Start Patroni on Leader (initializes the cluster)
  block:
    - name: Start and enable Patroni service on leader
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for Patroni REST API to become available on leader
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "0.0.0.0"
        state: started
        timeout: 180
        delay: 10

    - name: Wait for leader to be elected
      ansible.builtin.uri:
        url: "http://{{ ip }}:{{ patroni_restapi_port }}/primary"
        method: GET
        status_code: 200
      register: leader_check
      until: leader_check.status == 200
      retries: 30
      delay: 5
  when: inventory_hostname in groups['leader']

- name: Start Patroni on Replicas (stream from leader)
  block:
    - name: Start and enable Patroni service on replicas
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for Patroni REST API to become available on replica
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "0.0.0.0"
        state: started
        timeout: 300
        delay: 10
  when: inventory_hostname in groups['replica']
