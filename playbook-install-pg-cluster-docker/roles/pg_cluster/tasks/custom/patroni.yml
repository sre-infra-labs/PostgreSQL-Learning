---
- name: Create /etc/patroni config directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    mode: "0750"

- name: Generate /etc/patroni/patroni.yml from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.yml.j2"
    dest: /etc/patroni/patroni.yml
    mode: "0640"
  notify: restart patroni

# ---------------------------------------------------------------------------
# patronictl convenience — export PATRONICTL_CONFIG_FILE so -c flag is not needed.
# Covers interactive sessions (ssh, docker exec -it ... bash).
# For direct docker exec (docker exec pg1 patronictl ...) use:
#   docker exec -e PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml pg1 patronictl list
# ---------------------------------------------------------------------------
- name: Set PATRONICTL_CONFIG_FILE in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    line: "PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml"
    create: true
    mode: "0644"

- name: Set PATRONICTL_CONFIG_FILE for interactive shell sessions
  ansible.builtin.copy:
    dest: /etc/profile.d/patroni-env.sh
    content: "export PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml\n"
    mode: "0644"

- name: Create Patroni log directory
  ansible.builtin.file:
    path: "{{ patroni_log_dir }}"
    state: directory
    mode: "0750"

- name: Deploy Patroni systemd service file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/patroni.service.j2"
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: reload systemd daemon

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    state: directory
    mode: "0700"

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    mode: "0700"

- name: Check if PostgreSQL data directory is already initialized
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: _pg_data_initialized

- name: Ensure data directory is empty before init
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: "{{ item }}"
    mode: "0700"
  loop:
    - absent
    - directory
  when: not _pg_data_initialized.stat.exists

- name: Create PostgreSQL stats temp directory
  ansible.builtin.file:
    path: "{{ postgresql_stats_temp_directory_path }}"
    state: directory
    mode: "0750"

- name: Create PostgreSQL archive directory
  ansible.builtin.file:
    path: "{{ postgresql_data_archive }}"
    state: directory
    mode: "0700"

- name: Create PostgreSQL scripts directory
  ansible.builtin.file:
    path: "{{ postgresql_scripts_dir }}"
    state: directory
    mode: "0744"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Fix directory ownership for postgres user (Docker compatibility)
  ansible.builtin.file:
    path: "{{ item }}"
    owner: postgres
    group: postgres
    recurse: yes
  loop:
    - /etc/patroni
    - "{{ patroni_log_dir }}"
    - "{{ postgresql_log_dir }}"
    - "{{ postgresql_data_dir }}"
    - "{{ postgresql_stats_temp_directory_path }}"
    - "{{ postgresql_data_archive }}"
  ignore_errors: true

- name: Ensure locales package is installed
  ansible.builtin.package:
    name: locales
    state: present

- name: Generate {{ postgresql_locale }} locale
  ansible.builtin.command: locale-gen {{ postgresql_locale }}
  changed_when: true

# --- Start Patroni on Leader first, then Replicas ---

- name: Start Patroni on Leader (initializes the cluster)
  block:
    - name: Start and enable Patroni service on leader
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for Patroni REST API to become available on leader
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "0.0.0.0"
        state: started
        timeout: 180
        delay: 10

    - name: Wait for leader to be elected
      ansible.builtin.uri:
        url: "http://{{ ip }}:{{ patroni_restapi_port }}/primary"
        method: GET
        status_code: 200
      register: leader_check
      until: leader_check.status == 200
      retries: 30
      delay: 5
  when: inventory_hostname in groups['leader']

- name: Start Patroni on Replicas (stream from leader)
  block:
    - name: Start and enable Patroni service on replicas
      ansible.builtin.systemd:
        name: patroni
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for Patroni REST API to become available on replica
      ansible.builtin.wait_for:
        port: "{{ patroni_restapi_port }}"
        host: "0.0.0.0"
        state: started
        timeout: 300
        delay: 10
  when: inventory_hostname in groups['replica']
