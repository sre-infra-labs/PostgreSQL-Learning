---
- name: Download postgres_exporter binary on localhost
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  become: false

- name: Extract postgres_exporter archive on localhost
  ansible.builtin.unarchive:
    src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: false
    creates: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy postgres_exporter binary to containers
  ansible.builtin.copy:
    src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
    dest: "/usr/local/bin/postgres_exporter"
    mode: '0755'
    owner: root
    group: root

- name: Verify postgres_exporter binary
  ansible.builtin.stat:
    path: /usr/local/bin/postgres_exporter
  register: exporter_stat
  failed_when: not exporter_stat.stat.exists

- name: Create postgres_exporter system user
  ansible.builtin.user:
    name: postgres_exporter
    shell: /bin/false
    create_home: no
    system: yes

- name: Create environment file for postgres_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/postgres_exporter.env
    content: |
      DATA_SOURCE_NAME="postgresql://{{ patroni_superuser_username }}:{{ patroni_superuser_password }}@localhost:{{ postgresql_port }}/postgres?sslmode=disable"
    owner: postgres_exporter
    group: postgres_exporter
    mode: '0640'

- name: Create postgres_exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/postgres_exporter.service
    mode: '0644'
    content: |
      [Unit]
      Description=PostgreSQL Prometheus Exporter
      After=network.target patroni.service

      [Service]
      User=postgres_exporter
      EnvironmentFile=/etc/systemd/postgres_exporter.env
      ExecStart=/usr/local/bin/postgres_exporter \
        --web.listen-address=:9194 \
        --log.level=info
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart pg_exporter

- name: Enable and start postgres_exporter
  ansible.builtin.systemd:
    name: postgres_exporter
    state: started
    enabled: true
    daemon_reload: true
