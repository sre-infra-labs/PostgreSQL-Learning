---
# pgBouncer is already installed via postgres_packages (pgbouncer apt package).
# This task configures it inside each pg container and sets up a Patroni callback
# that reloads pgBouncer when the node's role changes.

- name: Create pgBouncer configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  loop:
    - /etc/pgbouncer
    - /var/log/pgbouncer

- name: Generate /etc/pgbouncer/pgbouncer.ini from template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pgbouncer.ini.j2"
    dest: /etc/pgbouncer/pgbouncer.ini
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload pgbouncer

- name: Generate pgBouncer userlist.txt (auth file)
  ansible.builtin.copy:
    dest: /etc/pgbouncer/userlist.txt
    content: |
      "{{ patroni_superuser_username }}" "{{ patroni_superuser_password }}"
      "{{ db_user_rw }}" "{{ db_user_rw_password }}"
      "{{ db_user_ro }}" "{{ db_user_ro_password }}"
    owner: postgres
    group: postgres
    mode: "0640"

- name: Create Patroni callback script for pgBouncer leader update
  ansible.builtin.copy:
    dest: /usr/local/bin/patroni_pgbouncer_callback.sh
    mode: "0755"
    content: |
      #!/bin/bash
      # Patroni callback: update pgBouncer target when role changes
      # Called by Patroni with: <script> <action> <role> <cluster>
      ACTION=$1
      ROLE=$2
      CLUSTER=$3

      PGBOUNCER_INI=/etc/pgbouncer/pgbouncer.ini
      LEADER_NODES="{{ groups['all'] | map('extract', hostvars, 'ip') | list | join(' ') }}"

      find_leader() {
        for ip in $LEADER_NODES; do
          if curl -sf --max-time 2 "http://${ip}:8008/primary" >/dev/null 2>&1; then
            echo "$ip"
            return
          fi
        done
      }

      case "$ACTION" in
        on_role_change)
          LEADER_IP=$(find_leader)
          if [ -n "$LEADER_IP" ]; then
            sed -i "s|^host=.*|host=${LEADER_IP}|" $PGBOUNCER_INI
            systemctl reload pgbouncer 2>/dev/null || systemctl restart pgbouncer 2>/dev/null
          fi
          ;;
        on_start|on_stop|on_restart)
          ;;
      esac

- name: Create pgBouncer systemd service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/pgbouncer.service.d
    state: directory
    mode: "0755"

- name: Set pgBouncer to run as postgres user
  ansible.builtin.copy:
    dest: /etc/systemd/system/pgbouncer.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      User=postgres
      Group=postgres
  notify: reload systemd daemon

- name: Enable and start pgBouncer service
  ansible.builtin.systemd:
    name: pgbouncer
    state: started
    enabled: true
    daemon_reload: true
