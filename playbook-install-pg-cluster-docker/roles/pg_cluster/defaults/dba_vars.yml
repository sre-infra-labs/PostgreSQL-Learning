# DBA Input Variables — loaded by tasks/main.yml from defaults/dba_vars.yml
# These are the same values as vars/dba_vars.yml (keep in sync)
# Override at playbook level via -e or vars_files: vars/dba_vars.yml

debug: true

patroni_cluster_name: "pg-docker-cls1"
pgbackrest_stanza_name: "pg-docker-cls1"

postgresql_version: "18"
postgresql_port: "5432"

server_hardware:
  cpu_count: 2
  ram_gb: 4
  disk_gb: 20

pg_params:
  work_mem: "4MB"
  maintenance_work_mem: "256MB"

db_name: "dba"
db_user_rw: dba_rw
db_user_ro: dba_ro

etcd_hosts: "172.20.0.10:2379"

pgbouncer_listen_port: 6432
pgbouncer_pool_mode: "transaction"
pgbouncer_max_client_conn: 200
pgbouncer_default_pool_size: 25
