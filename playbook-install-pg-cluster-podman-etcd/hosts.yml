all:
  children:
    primary_cluster:
      vars:
        pgbackrest_stanza_name: "podpg-cls1"
        patroni_cluster_name: "podpg-cls1"
      children:
        primary_cluster_leader:
          hosts:
            podpg-cls1-pg1:
              ip: "172.18.0.11"
              ansible_port: 2211   # 2200 + last 2 digits of IP

        primary_cluster_replica:
          hosts:
            podpg-cls1-pg2:
              ip: "172.18.0.12"
              ansible_port: 2212
            podpg-cls1-pg3:
              ip: "172.18.0.13"
              ansible_port: 2213
              patroni_tag_nofailover: true
              patroni_tag_nosync: true

    standby_cluster:
      vars:
        pgbackrest_stanza_name: "podpg-cls1"
        patroni_cluster_name: "podpg-cls1"
        patroni_standby_cluster_slot_name: "standby_cluster_slot"
      children:
        standby_cluster_leader:
          hosts:
            podpg-cls1-pg4:
              ip: "172.18.0.14"
              ansible_port: 2214
              patroni_standby_cluster:
                host: "172.18.0.10"   # Primary cluster leader VIP (floats to current leader)
                port: 5432
        standby_cluster_replica:
          hosts:
            # podpg-cls1-pg5:
            #   ip: "172.18.0.15"
            # podpg-cls1-pg6:
            #   ip: "172.18.0.16"

  vars:
    # Only SSH is published to the host (ansible_port → 22 inside container).
    # All other services (PostgreSQL, Patroni, pgBouncer, HAProxy, pg_exporter)
    # are reachable only within the lab-network (172.18.0.0/16) container network.
    podman_network: lab-network
    podman_network_subnet: "172.18.0.0/16"
    podpg_cls1_writer: "172.18.0.10"
    podpg_cls1_reader: "172.18.0.9"

    # ansible_connection: community.podman.podman
    ansible_host: "127.0.0.1"        # All containers are on the same Ryzen9 host; rootless Podman
                                      # bridge IPs (172.18.0.x) are not routable from the host —
                                      # connect via published host-side SSH ports instead.
    ansible_user: ansible
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_python_interpreter: /usr/bin/python3
