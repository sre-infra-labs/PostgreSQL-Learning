# Podman network — defined in hosts.yml (all.vars: podman_network, podman_network_subnet).
# The playbook will NOT recreate this network; it attaches pg containers to it.
# Ubuntu host (ryzen9 — Ubuntu 24.04): podman network create --driver bridge --subnet=172.18.0.0/16 lab-network
podman_network_driver: "bridge"

# Container image — built from Dockerfile in the project root
pg_node_image: "pg-cluster-node:latest"
pg_node_dockerfile_path: "{{ playbook_dir }}"

# etcd runs INSIDE each pg container (no separate etcd container)
# etcd forms a 3-member cluster using container IPs over the podman network
# Ports 2379 (client) and 2380 (peer) are container-internal only

# Keepalived VIPs — sourced from hosts.yml (all.vars: podpg_cls1_writer / podpg_cls1_reader)
# and mapped to keepalived_vip / keepalived_replica_vip in vars/dba_vars.yml.

# Per-node ports are defined in hosts.yml under each host's vars:
#   ansible_port            — SSH host-side port (2200 + last octet of container IP)
#   pg_port                 — host-side PostgreSQL port  (5432 inside container)
#   patroni_port            — host-side Patroni REST API  (8008 inside container)
#   pg_exporter_port        — host-side pg_exporter port  (9194 inside container)
#   pgbouncer_port          — host-side pgBouncer port    (6432 inside container)
#   haproxy_write_host_port — host-side HAProxy write     (5000 inside container)
#   haproxy_read_host_port  — host-side HAProxy read      (5001 inside container)
#   haproxy_stats_host_port — host-side HAProxy stats     (7000 inside container)


# Podman named volumes
pg_data_volume_prefix: "pg-data"
pg_log_volume_prefix: "pg-logs"
pg_backup_volume: "pg-backups"

# SSH key for Ansible access to containers
ansible_ssh_public_key_path: "~/.ssh/id_ed25519.pub"
