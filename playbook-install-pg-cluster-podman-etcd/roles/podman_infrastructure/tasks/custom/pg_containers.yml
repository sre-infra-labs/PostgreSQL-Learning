---
# All per-host port variables (pg_port, patroni_port, pg_exporter_port, pgbouncer_port,
# haproxy_write_host_port, haproxy_read_host_port, haproxy_stats_host_port, ansible_port)
# are defined in hosts.yml under each host's vars — no hardcoded values here.

- name: Build combined container host list from inventory
  ansible.builtin.set_fact:
    pg_all_hosts: >-
      {{
        (groups['primary_cluster_leader'] | default([]))
        + (groups['primary_cluster_replica'] | default([]))
        + (groups['standby_cluster'] | default([]))
      }}

- name: Read SSH public key from local machine
  ansible.builtin.slurp:
    src: "{{ ansible_ssh_public_key_path | expanduser }}"
  register: ssh_pub_key

- name: Create per-node PostgreSQL data volumes
  ansible.builtin.command: podman volume create {{ pg_data_volume_prefix }}-{{ item }}
  loop: "{{ pg_all_hosts }}"
  register: data_volume_result
  failed_when: false
  changed_when: "'Error' not in data_volume_result.stdout and data_volume_result.rc == 0"

- name: Create per-node PostgreSQL log volumes
  ansible.builtin.command: podman volume create {{ pg_log_volume_prefix }}-{{ item }}
  loop: "{{ pg_all_hosts }}"
  register: log_volume_result
  failed_when: false
  changed_when: "'Error' not in log_volume_result.stdout and log_volume_result.rc == 0"

- name: Create shared pgbackrest backup volume
  ansible.builtin.command: podman volume create {{ pg_backup_volume }}
  register: backup_volume_result
  failed_when: false
  changed_when: "'Error' not in backup_volume_result.stdout and backup_volume_result.rc == 0"

- name: Check which standby containers exist before removal
  ansible.builtin.command: podman container exists {{ item }}
  loop: "{{ groups['standby_cluster'] | default([]) }}"
  register: standby_container_exists
  failed_when: false
  changed_when: false
  when: target_hosts is defined and target_hosts == 'standby_cluster'

- name: Remove stale standby containers if deploying standby only
  ansible.builtin.command: podman rm -f {{ item.item }}
  loop: "{{ standby_container_exists.results | default([]) }}"
  when:
    - target_hosts is defined and target_hosts == 'standby_cluster'
    - item.rc == 0

- name: Wait for ports to be released
  ansible.builtin.pause:
    seconds: 3
  when: target_hosts is defined and target_hosts == 'standby_cluster'

- name: Create PostgreSQL node containers
  ansible.builtin.command: >
    podman run -d
    --name {{ item }}
    --hostname {{ item }}
    --env PATRONICTL_CONFIG_FILE=/etc/patroni/patroni.yml
    --network {{ podman_network }}:ip={{ hostvars[item].ip }}
    --privileged
    --cgroupns=host
    --dns 8.8.8.8
    --dns 1.1.1.1
    --tmpfs /run
    --tmpfs /run/lock
    --volume {{ pg_data_volume_prefix }}-{{ item }}:/var/lib/postgresql
    --volume {{ pg_log_volume_prefix }}-{{ item }}:/var/log
    --volume {{ pg_backup_volume }}:/var/lib/pgbackrest
    --volume /sys/fs/cgroup:/sys/fs/cgroup:rw
    --publish {{ hostvars[item].ansible_port }}:22
    --restart=unless-stopped
    {{ pg_node_image }}
  loop: "{{ pg_all_hosts }}"
  register: container_create
  failed_when: false
  changed_when: "'Error' not in container_create.stdout and container_create.rc == 0"

- name: Handle containers that already exist
  ansible.builtin.debug:
    msg: "Container {{ item.item }} already exists or network attachment failed: {{ item.stdout }}"
  when: item.rc != 0
  loop: "{{ container_create.results }}"

- name: Inject SSH public key into containers
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c "
      mkdir -p /home/ansible/.ssh
      chmod 700 /home/ansible/.ssh
      echo '{{ ssh_pub_key.content | b64decode | trim }}' >> /home/ansible/.ssh/authorized_keys
      sort -u /home/ansible/.ssh/authorized_keys -o /home/ansible/.ssh/authorized_keys
      chmod 600 /home/ansible/.ssh/authorized_keys
      chown -R ansible:ansible /home/ansible/.ssh
    "
  loop: "{{ pg_all_hosts }}"
  changed_when: true
  register: ssh_inject
  failed_when: ssh_inject.rc != 0

- name: Configure DNS resolvers in containers (/etc/resolv.conf)
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c '
      echo "nameserver 8.8.8.8" > /etc/resolv.conf
      echo "nameserver 1.1.1.1" >> /etc/resolv.conf
      echo "options ndots:0" >> /etc/resolv.conf
    '
  loop: "{{ pg_all_hosts }}"
  changed_when: true

- name: Remove apt proxy config (direct downloads — proxy not reachable from Podman bridge)
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c 'rm -f /etc/apt/apt.conf.d/01proxy'
  loop: "{{ pg_all_hosts }}"
  changed_when: true

- name: Force apt to use IPv4 to prevent 'Waiting for headers' IPv6 timeouts
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c '
      echo "Acquire::ForceIPv4 \"true\";" > /etc/apt/apt.conf.d/99force-ipv4
    '
  loop: "{{ pg_all_hosts }}"
  changed_when: true

- name: Disable IPv6 in containers via sysctl
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c '
      sysctl -w net.ipv6.conf.all.disable_ipv6=1
      sysctl -w net.ipv6.conf.default.disable_ipv6=1
    '
  loop: "{{ pg_all_hosts }}"
  changed_when: true

- name: Stop and mask apt-daily timers to prevent apt lock conflicts
  ansible.builtin.shell: |
    podman exec {{ item }} bash -c '
      systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
      systemctl disable apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
      systemctl mask apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
    '
  loop: "{{ pg_all_hosts }}"
  changed_when: true

- name: Wait for SSH to be available on all containers
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ hostvars[item].ansible_port }}"
    state: started
    timeout: 90
    delay: 3
  loop: "{{ pg_all_hosts }}"

- name: Container connectivity summary
  ansible.builtin.debug:
    msg:
      - "{{ item }} | IP: {{ hostvars[item].ip }}"
      - "  SSH (host):  127.0.0.1:{{ hostvars[item].ansible_port }}"
      - "  All other services reachable only within the container network (172.18.0.0/16)"
  loop: "{{ pg_all_hosts }}"
