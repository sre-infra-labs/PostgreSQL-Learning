---
- name: Check if Podman network '{{ podman_network }}' exists
  ansible.builtin.command: podman network inspect {{ podman_network }}
  register: network_inspect
  failed_when: false
  changed_when: false

- name: Fail if required network does not exist
  ansible.builtin.fail:
    msg: >
      Podman network '{{ podman_network }}' does not exist.
      This is a shared lab network — create it first with MTU 1450 to prevent apt timeout issues:
        podman network create --driver bridge --subnet={{ podman_network_subnet }} --opt mtu=1450 {{ podman_network }}
      NOTE: MTU 1450 (not 1500) avoids packet fragmentation on Ubuntu VMs/hypervisors.
      If the network already exists without this MTU, recreate it:
        podman network rm {{ podman_network }}
        podman network create --driver bridge --subnet={{ podman_network_subnet }} --opt mtu=1450 {{ podman_network }}
  when: network_inspect.rc != 0

- name: Network exists — attaching pg containers to it
  ansible.builtin.debug:
    msg: "Network '{{ podman_network }}' exists — pg containers will be attached to it"
  when: network_inspect.rc == 0
