---
- name: Inside pg_cluster/tasks/main.yml
  ansible.builtin.debug:
    msg: "Installing PostgreSQL {{ postgresql_version }} cluster with Patroni + etcd + pgbackrest + pgbouncer"

- name: Include defaults/creds.yml
  include_vars:
    file: "{{ role_path }}/defaults/creds.yml"
  tags: always


- name: Run prechecks
  include_tasks:
    file: custom/prechecks.yml
    apply:
      tags: prechecks
  tags: prechecks

- name: Setup PGDG repository
  include_tasks:
    file: custom/repository.yml
    apply:
      tags: repository
  tags: repository

- name: Install packages
  include_tasks:
    file: custom/packages.yml
    apply:
      tags: packages
  tags: packages

- name: Configure .pgpass and .pgpass_patroni
  include_tasks:
    file: custom/pgpass.yml
    apply:
      tags: pgpass
  tags: pgpass

- name: Set PostgreSQL environment variables in container
  include_tasks:
    file: custom/container_env.yml
    apply:
      tags: container_env
  tags: container_env

- name: Populate /etc/hosts with cluster node entries
  include_tasks:
    file: custom/container_hosts.yml
    apply:
      tags: container_hosts
  tags: container_hosts

- name: Install and configure etcd (inside container, 3-member cluster)
  include_tasks:
    file: custom/etcd.yml
    apply:
      tags: etcd
  tags: etcd

- name: Install and configure Patroni
  include_tasks:
    file: custom/patroni.yml
    apply:
      tags: patroni
  tags: patroni
  # Runs on all nodes; leader/replica distinction handled inside patroni.yml

- name: Configure pgBackRest
  include_tasks:
    file: custom/pgbackrest.yml
    apply:
      tags: pgbackrest
  tags: pgbackrest

- name: Install and configure pgBouncer
  include_tasks:
    file: custom/pgbouncer.yml
    apply:
      tags: pgbouncer
  tags: pgbouncer

- name: Install pg_exporter
  include_tasks:
    file: custom/pg_exporter.yml
    apply:
      tags: pg_exporter
  tags: pg_exporter

- name: Register permanent replication slot in Patroni DCS
  # bootstrap.dcs.slots seeds the slot only on first initdb.
  # This PATCH keeps the DCS in sync on every playbook run (idempotent).
  # PATCH merges — it never overwrites unrelated DCS settings.
  # Targets the primary cluster leader so the request always reaches the current leader.
  # Slot name comes from standby cluster inventory (patroni_standby_cluster_slot_name),
  # falling back to the default patroni_standby_primary_slot_name.
  vars:
    _standby_leader: "{{ groups['standby_cluster_leader'] | default([]) | first | default('') }}"
    _slot_name: >-
      {{
        (hostvars[_standby_leader]['patroni_standby_cluster_slot_name']
         | default(patroni_standby_primary_slot_name))
        if _standby_leader else patroni_standby_primary_slot_name
      }}
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ patroni_restapi_port }}/config"
    method: PATCH
    body_format: json
    body: "{{ {'slots': { _slot_name: {'type': 'physical'} } } }}"
    status_code: [200, 201]
  run_once: true
  delegate_to: "{{ groups['primary_cluster_leader'][0] }}"
  when:
    - inventory_hostname in groups['primary_cluster']
    - groups['standby_cluster'] | default([]) | length > 0
    - _slot_name | length > 0
  tags: patroni

- name: Create application database and users
  include_tasks:
    file: custom/user.yml
    apply:
      tags: users
  tags: users
  when: inventory_hostname not in groups['standby_cluster']

- name: Install and configure HAProxy
  include_tasks:
    file: custom/haproxy.yml
    apply:
      tags: haproxy
  tags: haproxy

- name: Install and configure Keepalived
  include_tasks:
    file: custom/keepalived.yml
    apply:
      tags: keepalived
  tags: keepalived
  when: inventory_hostname not in groups['standby_cluster']

- name: Show Patroni cluster status
  include_tasks:
    file: custom/patronictl_list.yml
    apply:
      tags: patronictl_list
  tags: patronictl_list
  when: >-
    inventory_hostname in groups['primary_cluster_leader'] or
    inventory_hostname in groups['standby_cluster_leader']
