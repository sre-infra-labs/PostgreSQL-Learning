---
- name: Begin pg_cluster/custom/prechecks.yml
  ansible.builtin.debug:
    msg: "Running pre-installation checks"

- name: Check Ansible version
  ansible.builtin.fail:
    msg: "Ansible {{ minimal_ansible_version }} or higher is required (found {{ ansible_version.full }})"
  delegate_to: localhost
  when: ansible_version.full is version(minimal_ansible_version, '<')

# -------------------------------------------------------------------
#  FRESH INSTALL GUARDS — skip these on reinit
# -------------------------------------------------------------------
- name: Check if data directory is already initialized
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: pgdata_initialized
  when: not (reinit_cluster is defined and reinit_cluster | bool)

- name: Fail if data directory is already initialized
  ansible.builtin.fail:
    msg: "Data directory {{ postgresql_data_dir }} is already initialized. Use -e reinit_cluster=true to reinitialize."
  when:
    - not (reinit_cluster is defined and reinit_cluster | bool)
    - pgdata_initialized.stat is defined
    - pgdata_initialized.stat.exists | default(false)

# -------------------------------------------------------------------
#  REINIT CLEANUP — only runs when reinit_cluster=true
#  Fully wipes all state so the next install starts completely fresh:
#    Patroni, etcd, PGDATA, configs, pgpass, pgBackRest, logs
# -------------------------------------------------------------------
- name: Stop Patroni service (reinit mode)
  ansible.builtin.shell: systemctl stop patroni 2>/dev/null || true
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Stop etcd service (reinit mode)
  ansible.builtin.shell: systemctl stop etcd 2>/dev/null || true
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Remove PostgreSQL data directory (reinit mode)
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: absent
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Remove Patroni config directory (reinit mode)
  ansible.builtin.shell: rm -rf /etc/patroni 2>/dev/null || true
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Remove pgpass files (reinit mode)
  ansible.builtin.shell: |
    rm -f /root/.pgpass /root/.pgpass_patroni 2>/dev/null || true
    rm -f /var/lib/postgresql/.pgpass /var/lib/postgresql/.pgpass_patroni 2>/dev/null || true
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Wipe etcd data directory (reinit mode)
  ansible.builtin.shell: rm -rf /var/lib/etcd/* 2>/dev/null || true
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Clear log and spool directories (reinit mode)
  ansible.builtin.shell: "rm -rf {{ item }}/* 2>/dev/null || true"
  loop:
    - "{{ postgresql_log_dir }}"
    - "{{ patroni_log_dir }}"
    - "/var/log/pgbackrest"
    - "/var/log/etcd"
    - "/var/spool/pgbackrest"
  changed_when: false
  when: reinit_cluster is defined and reinit_cluster | bool

- name: Remove pgBackRest archives and backups (reinit mode)
  ansible.builtin.shell: |
    rm -rf {{ pgbackrest_repo1_path }}/archive/{{ pgbackrest_stanza_name }} 2>/dev/null || true
    rm -rf {{ pgbackrest_repo1_path }}/backup/{{ pgbackrest_stanza_name }} 2>/dev/null || true
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['primary_cluster_leader'] | first }}"
  when: reinit_cluster is defined and reinit_cluster | bool

- name: End pg_cluster/custom/prechecks.yml
  ansible.builtin.debug:
    msg: "Pre-installation checks passed"
