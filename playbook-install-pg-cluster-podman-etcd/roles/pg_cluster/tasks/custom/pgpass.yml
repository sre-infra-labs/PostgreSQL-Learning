---
# Write pgpass files as root — do NOT set owner/group in the copy module.
# The postgres OS user may not exist yet (packages skipped in reinit mode).
# A separate shell step chowns only when the user exists.

# .pgpass_patroni — used exclusively by Patroni internally (pg_basebackup, pg_rewind, psql).
# Contains the full entry list from postgresql_pgpass (host-specific + wildcard entries).
- name: Configure {{ postgresql_home_dir }}/.pgpass_patroni
  ansible.builtin.copy:
    content: |
      {% for entry in postgresql_pgpass %}
      {{ entry }}
      {% endfor %}
    dest: "{{ postgresql_home_dir }}/.pgpass_patroni"
    mode: "0600"
  when:
    - postgresql_pgpass is defined
    - postgresql_pgpass | length > 0

- name: Set .pgpass_patroni ownership to postgres (if user exists)
  ansible.builtin.shell: |
    id postgres &>/dev/null && chown postgres:postgres {{ postgresql_home_dir }}/.pgpass_patroni || true
  changed_when: false
  when:
    - postgresql_pgpass is defined
    - postgresql_pgpass | length > 0

# .pgpass — general-purpose pgpass for the postgres OS user (used by podman exec ... psql).
# Wildcard entries so any psql invocation inside the container authenticates without PGPASSWORD.
- name: Configure {{ postgresql_home_dir }}/.pgpass
  ansible.builtin.copy:
    content: |
      *:*:*:{{ patroni_superuser_username }}:{{ patroni_superuser_password }}
      *:*:*:{{ patroni_replication_username }}:{{ patroni_replication_password }}
    dest: "{{ postgresql_home_dir }}/.pgpass"
    mode: "0600"

- name: Set .pgpass ownership to postgres (if user exists)
  ansible.builtin.shell: |
    id postgres &>/dev/null && chown postgres:postgres {{ postgresql_home_dir }}/.pgpass || true
  changed_when: false
