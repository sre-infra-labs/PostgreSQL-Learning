---
- name: Create application database '{{ db_name }}'
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    state: present
    login_user: postgres
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Create read-write user '{{ db_user_rw }}'
  community.postgresql.postgresql_user:
    name: "{{ db_user_rw }}"
    password: "{{ db_user_rw_password }}"
    role_attr_flags: LOGIN
    state: present
    login_user: postgres
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Grant read-write privileges to '{{ db_user_rw }}'
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    login_user: postgres
    query: |
      GRANT ALL PRIVILEGES ON DATABASE "{{ db_name }}" TO "{{ db_user_rw }}";
      GRANT pg_read_all_data, pg_write_all_data TO "{{ db_user_rw }}";
      GRANT pg_read_all_stats TO "{{ db_user_rw }}";
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Create read-only user '{{ db_user_ro }}'
  community.postgresql.postgresql_user:
    name: "{{ db_user_ro }}"
    password: "{{ db_user_ro_password }}"
    role_attr_flags: LOGIN
    state: present
    login_user: postgres
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Grant read-only privileges to '{{ db_user_ro }}'
  community.postgresql.postgresql_query:
    db: "{{ db_name }}"
    login_user: postgres
    query: |
      GRANT CONNECT ON DATABASE "{{ db_name }}" TO "{{ db_user_ro }}";
      GRANT pg_read_all_data TO "{{ db_user_ro }}";
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Create pg_stat_statements extension
  community.postgresql.postgresql_ext:
    db: "{{ db_name }}"
    name: pg_stat_statements
    state: present
    login_user: postgres
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Create dblink extension
  community.postgresql.postgresql_ext:
    db: "{{ db_name }}"
    name: dblink
    state: present
    login_user: postgres
  become_user: postgres
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Check if pg_wait_sampling shared library is installed
  ansible.builtin.shell: >
    find /usr/lib/postgresql -name "pg_wait_sampling.so" 2>/dev/null | grep -q .
  register: pg_wait_sampling_lib
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['primary_cluster_leader']

- name: Create pg_wait_sampling extension
  community.postgresql.postgresql_ext:
    db: "{{ db_name }}"
    name: pg_wait_sampling
    state: present
    login_user: postgres
  become_user: postgres
  when:
    - inventory_hostname in groups['primary_cluster_leader']
    - pg_wait_sampling_lib.rc == 0

- name: Skip pg_wait_sampling — shared library not found
  ansible.builtin.debug:
    msg: "pg_wait_sampling.so not present on {{ inventory_hostname }} — extension skipped"
  when:
    - inventory_hostname in groups['primary_cluster_leader']
    - pg_wait_sampling_lib.rc != 0
