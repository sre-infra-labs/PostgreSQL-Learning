---
- name: reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  listen: 'systemd daemon-reload'

- name: restart patroni
  ansible.builtin.service:
    name: patroni
    state: restarted
  listen: 'restart patroni'
  # Skipped when service activation is deferred (playbook-add-replicas.yml installs
  # and configures first, then starts patroni explicitly in its activation phase).
  when: pg_cluster_activate_services | default(true)

- name: reload pgbouncer
  ansible.builtin.service:
    name: pgbouncer
    state: reloaded
  listen: 'reload pgbouncer'

- name: restart pg_exporter
  ansible.builtin.service:
    name: postgres_exporter
    state: restarted
  listen: 'restart pg_exporter'

- name: reload haproxy
  ansible.builtin.service:
    name: haproxy
    state: reloaded
  listen: 'reload haproxy'

- name: restart keepalived
  ansible.builtin.service:
    name: keepalived
    state: restarted
  listen: 'restart keepalived'
