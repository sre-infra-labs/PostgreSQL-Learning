[defaults]
# Default inventory
inventory = hosts.yml

# SSH connection settings
host_key_checking = False
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519

# Performance - increased timeout for apt operations in containers
forks = 10
timeout = 300

# Logging
log_path = /tmp/ansible.log

# Playbook behavior
force_color = True
display_skipped_hosts = False

# Connection settings for long-running tasks
command_warnings = False
