---
- name: Setup Podman Infrastructure for PostgreSQL Cluster
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/dba_vars.yml

  pre_tasks:
    - name: Starting Podman Infrastructure Setup
      ansible.builtin.debug:
        msg: "Setting up Podman infrastructure for PostgreSQL 18 multi-datacenter cluster (Patroni + etcd)"

  roles:
    - role: roles/podman_infrastructure

  post_tasks:
    - name: Podman Infrastructure Setup Completed
      ansible.builtin.debug:
        msg: "{{ item }} | IP: {{ hostvars[item].ip }} | SSH: 127.0.0.1:{{ hostvars[item].ansible_port }}"
      loop: >-
        {{
          (groups['primary_cluster_leader'] | default([]))
          + (groups['primary_cluster_replica'] | default([]))
          + (groups['standby_cluster'] | default([]))
        }}

    - name: Podman Infrastructure — cluster summary
      ansible.builtin.debug:
        msg:
          - "Only SSH ports are published to the host. All other services are internal to {{ podman_network }} ({{ podman_network_subnet }})."
          - "Keepalived VIP => {{ podpg_cls1_writer }} (write) / {{ podpg_cls1_reader }} (read)"
          - ""
          - "Next (Primary Cluster): ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"
          - "Next (Standby Cluster): ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass"

# ansible-playbook playbook-setup-podman.yml                   # all containers (podpg-cls1-pg1 through podpg-cls1-pg4)
# ansible-playbook playbook-setup-podman.yml --tags network    # only network
# ansible-playbook playbook-setup-podman.yml --tags containers # only containers (safe to re-run; existing containers are skipped)
