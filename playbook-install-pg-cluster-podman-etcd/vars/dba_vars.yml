# DBA Input Variables for Podman-based PostgreSQL 18 Cluster (Ubuntu 24.04)
# Modify these values before running the playbook

debug: true

# Cluster name and stanza are set per-group in hosts.yml (primary_cluster.vars / standby_cluster.vars)

# ReInit Standby — set to true ONLY when rebuilding after a failure (skips package install)
# reinit_cluster: true
# cleanup_pgbackrest_backups: true

# PostgreSQL version (PGDG repo)
postgresql_version: "18"
postgresql_port: "5432"

# Hardware info (Podman container resources — adjust based on your Ubuntu host's allocation)
server_hardware:
  cpu_count: 2
  ram_gb: 4
  disk_gb: 20

# postgresql.conf tuning params
pg_params:
  work_mem: "4MB"
  maintenance_work_mem: "256MB"

# Application database and users
db_name: "dba"
db_user_rw: dba_rw
db_user_ro: dba_ro

# Podman network — defined in hosts.yml (all.vars: podman_network, podman_network_subnet)
# Create once: podman network create --driver bridge --subnet=172.18.0.0/16 lab-network

# etcd DCS — runs INSIDE each pg container (3-member cluster)
# etcd_hosts is auto-built from inventory IPs in defaults/main.yml — no override needed
etcd_version: "3.5.17"

# pgBouncer settings (installed inside each pg container)
pgbouncer_listen_port: 6432
pgbouncer_pool_mode: "transaction"
pgbouncer_max_client_conn: 200
pgbouncer_default_pool_size: 25

# HAProxy settings (installed inside each pg container)
# Port 5000 → primary-only write traffic (checks GET /primary on Patroni REST API)
# Port 5001 → replica read traffic     (checks GET /replica on Patroni REST API)
# Port 7000 → HAProxy stats HTTP UI
haproxy_write_port: 5000
haproxy_read_port: 5001
haproxy_stats_port: 7000
haproxy_stats_user: admin

# Keepalived VRRP settings (installed inside each pg container)
# VIPs are defined in hosts.yml (all.vars) as podpg_cls1_writer and podpg_cls1_reader.
# Connect via VIP:5000 (write) or VIP:5001 (read) for fully HA access
keepalived_vip: "{{ podpg_cls1_writer }}"         # primary/write VIP → always points to Patroni leader
keepalived_replica_vip: "{{ podpg_cls1_reader }}"  # replica VIP → sync standby (sync mode) or any healthy replica
keepalived_vip_prefix: "24"
keepalived_interface: "eth0"
keepalived_virtual_router_id: 51      # VI_PRIMARY=51, VI_REPLICA=52
keepalived_auth_pass: "pglabvr1"
keepalived_check_interval: 2
keepalived_check_rise: 2
keepalived_check_fall: 3
keepalived_weight: 100
