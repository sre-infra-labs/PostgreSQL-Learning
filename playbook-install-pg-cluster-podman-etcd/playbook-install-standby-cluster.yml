---
# Standby Cluster Playbook
# Installs standby_cluster nodes as a standby cluster in Region B (Secondary Datacenter).
# Same patroni_cluster_name as primary to enable seamless failover/failback.
# Standby nodes stream from the primary cluster leader via the standby_cluster configuration
# defined in hosts.yml (patroni_standby_cluster: { host: ..., port: 5432 }).

- name: Install PostgreSQL Standby Cluster in Podman containers
  hosts: standby_cluster
  become: true
  become_user: root
  gather_facts: true
  vars_files:
    - sensitive-values
    - vars/dba_vars.yml
  collections:
    - community.postgresql

  pre_tasks:
    - name: Starting PostgreSQL Standby Cluster Installation
      ansible.builtin.debug:
        msg: >-
          Installing PostgreSQL {{ postgresql_version }} standby cluster node {{ inventory_hostname }}
          ({{ patroni_cluster_name }}) with Patroni streaming from primary via
          {{ patroni_standby_cluster.host | default('undefined — set patroni_standby_cluster in hosts.yml') }}

  roles:
    - role: roles/pg_cluster

  post_tasks:
    - name: PostgreSQL Standby Cluster Installation Completed
      ansible.builtin.debug:
        msg:
          - "PostgreSQL {{ postgresql_version }} standby cluster installation completed!"
          - "  Nodes: {{ groups['standby_cluster'] | join(', ') }}"
          - "  Cluster name: {{ patroni_cluster_name }}"
          - ""
          - "Verify standby is streaming (run on any primary cluster node):"
          - "  patronictl -c /etc/patroni/patroni.yml list"
      run_once: true

# Usage:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass
#
# Install only specific components on standby:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass --tags patroni
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass --tags pgbouncer
#
# Reinitialize standby cluster:
#   ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass -e reinit_cluster=true
