---
- name: Install PostgreSQL Primary Cluster in Podman containers
  hosts: primary_cluster
  become: true
  become_user: root
  gather_facts: true
  vars_files:
    - sensitive-values
    - vars/dba_vars.yml
  collections:
    - community.postgresql

  pre_tasks:
    - name: Starting PostgreSQL Primary Cluster Installation
      ansible.builtin.debug:
        msg: "Installing PostgreSQL {{ postgresql_version }} ({{ patroni_cluster_name }}) with Patroni + etcd + pgbackrest + pgbouncer + pg_exporter + HAProxy + Keepalived"

  roles:
    - role: roles/pg_cluster

  post_tasks:
    - name: PostgreSQL Primary Cluster Installation Completed
      ansible.builtin.debug:
        msg:
          - "PostgreSQL {{ postgresql_version }} primary cluster ({{ patroni_cluster_name }}) installation completed!"
          - "  Nodes: {{ groups['primary_cluster'] | join(', ') }}"
          - ""
          - "Next — install standby cluster:"
          - "  ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass"
      run_once: true

# Full install:
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass
#
# Reinitialize cluster (after failure):
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass -e reinit_cluster=true
#
# Reinitialize and clean backups:
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass -e reinit_cluster=true -e cleanup_pgbackrest_backups=true
#
# Run specific task only:
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass --tags pgbouncer
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass --tags haproxy,keepalived
