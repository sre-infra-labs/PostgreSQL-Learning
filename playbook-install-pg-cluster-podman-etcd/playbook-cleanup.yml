---
# Cleanup playbook — tears down the PostgreSQL Podman cluster so the full setup
# can be run again from scratch. Designed for repeated learning / testing cycles.
#
# NOTE: 'lab-network' is a SHARED network used by other lab containers and is
# NEVER removed by this playbook. Only pg cluster containers and volumes are cleaned up.
#
# USAGE
# ─────
# Standard cleanup (containers + volumes, keeps image + network):
#   ansible-playbook playbook-cleanup.yml
#
# Skip the confirmation prompt (for scripting / full cycle):
#   ansible-playbook playbook-cleanup.yml -e skip_confirm=true
#
# Also remove the Podman image (forces a full image rebuild on next run):
#   ansible-playbook playbook-cleanup.yml -e remove_image=true
#
# Selective cleanup using tags:
#   ansible-playbook playbook-cleanup.yml --tags containers  # only containers
#   ansible-playbook playbook-cleanup.yml --tags volumes     # only volumes
#   ansible-playbook playbook-cleanup.yml --tags image       # only image
#
# Full cycle (cleanup → infra → install) in one command:
#   ansible-playbook playbook-cleanup.yml -e skip_confirm=true && \
#   ansible-playbook playbook-setup-podman.yml && \
#   ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass

- name: Cleanup Podman PostgreSQL Cluster
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- what to clean (override with -e) ---
    remove_containers: true    # stop + remove pg1, pg2, pg3, pg4
    remove_volumes:    true    # remove all named Podman volumes (pg-data-*, pg-logs-*, pg-backups)
    remove_image:      false   # remove pg-cluster-node:latest (slow to rebuild — off by default)
    skip_confirm:      false   # set true to bypass the confirmation prompt

    # NOTE: remove_network is intentionally absent.
    # lab-network is a SHARED network used by other containers
    # and must NEVER be removed. The pg containers are simply detached when removed.

    # --- derived from podman_infrastructure defaults ---
    _all_containers:
      - pg1
      - pg2
      - pg3
      - pg4

    _all_volumes:
      - pg-data-pg1
      - pg-data-pg2
      - pg-data-pg3
      - pg-data-pg4
      - pg-logs-pg1
      - pg-logs-pg2
      - pg-logs-pg3
      - pg-logs-pg4
      - pg-backups

    _podman_image:   "pg-cluster-node:latest"
    # lab-network intentionally excluded — it is shared with other lab containers

  pre_tasks:
    - name: Show cleanup plan
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  PostgreSQL Podman Cluster — Cleanup Plan"
          - "======================================================"
          - "  Containers  : {{ _all_containers | join(', ') }}"
          - "  Volumes     : {{ _all_volumes | join(', ') }}"
          - "  Image       : {{ _podman_image }}  (remove={{ remove_image }})"
          - "  Network     : lab-network (never removed — shared with other lab containers)"
          - "======================================================"

    - name: Confirm destructive cleanup
      ansible.builtin.pause:
        prompt: |
          WARNING: This will permanently delete all containers and data volumes.
          Type 'yes' to continue, anything else to abort
      register: _confirm
      when: not (skip_confirm | bool)

    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Cleanup aborted."
      when:
        - not (skip_confirm | bool)
        - _confirm.user_input | lower != 'yes'

  tasks:

    # ------------------------------------------------------------------ #
    #  CONTAINERS                                                          #
    # ------------------------------------------------------------------ #
    - name: Stop and remove containers
      ansible.builtin.command: podman rm -f {{ item }}
      loop: "{{ _all_containers }}"
      ignore_errors: true
      changed_when: false
      tags: containers
      when: remove_containers | bool

    - name: Containers removed
      ansible.builtin.debug:
        msg: "Containers removed: {{ _all_containers | join(', ') }}"
      tags: containers
      when: remove_containers | bool

    # ------------------------------------------------------------------ #
    #  VOLUMES                                                             #
    # ------------------------------------------------------------------ #
    - name: Remove Podman named volumes
      ansible.builtin.command: podman volume rm -f {{ item }}
      loop: "{{ _all_volumes }}"
      ignore_errors: true
      changed_when: false
      tags: volumes
      when: remove_volumes | bool

    - name: Volumes removed
      ansible.builtin.debug:
        msg: "Volumes removed: {{ _all_volumes | join(', ') }}"
      tags: volumes
      when: remove_volumes | bool

    # ------------------------------------------------------------------ #
    #  IMAGE (optional — slow to rebuild, skipped by default)             #
    # ------------------------------------------------------------------ #
    - name: Remove pg-cluster-node Podman image
      ansible.builtin.command: podman rmi -f {{ _podman_image }}
      ignore_errors: true
      changed_when: false
      tags: image
      when: remove_image | bool

    - name: Image removed
      ansible.builtin.debug:
        msg: "Image '{{ _podman_image }}' removed — will be rebuilt on next Phase 1 run"
      tags: image
      when: remove_image | bool

    # ------------------------------------------------------------------ #
    #  KNOWN HOSTS — remove stale SSH entries for containers              #
    # ------------------------------------------------------------------ #
    - name: Remove stale SSH known_hosts entries for container ports
      ansible.builtin.known_hosts:
        name: "[127.0.0.1]:{{ item }}"
        state: absent
      loop:
        - 2221
        - 2222
        - 2223
        - 2224
      ignore_errors: true
      tags: containers

  post_tasks:
    - name: Cleanup complete — ready for a fresh setup run
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  Cleanup done!  Run the setup again with:"
          - ""
          - "  Step 1 — Podman infra:"
          - "    ansible-playbook playbook-setup-podman.yml"
          - ""
          - "  Step 2 — Primary cluster install (pg1, pg2, pg3):"
          - "    ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"
          - ""
          - "  Step 3 — Standby cluster install (pg4 — optional):"
          - "    ansible-playbook -i hosts.yml playbook-install-standby-cluster.yml --vault-password-file=vault-pass"
          - ""
          - "  Or run primary cluster steps in one command:"
          - "    ansible-playbook playbook-cleanup.yml -e skip_confirm=true &&"
          - "    ansible-playbook playbook-setup-podman.yml &&"
          - "    ansible-playbook -i hosts.yml playbook-install-pg-cluster.yml --vault-password-file=vault-pass"
          - "======================================================"
