---
# Write pgpass files for the postgres user to enable password-less authentication.
# Write as root — do NOT set owner/group in the copy module.
# The postgres OS user may not exist yet (packages skipped in reinit mode).
# A separate shell step chowns only when the user exists.

- name: Configure {{ postgresql_home_dir }}/.pgpass for standalone PostgreSQL
  ansible.builtin.copy:
    content: |
      *:*:*:{{ postgres_superuser_username }}:{{ postgres_superuser_password }}
    dest: "{{ postgresql_home_dir }}/.pgpass"
    mode: "0600"

- name: Set .pgpass ownership to postgres (if user exists)
  ansible.builtin.shell: |
    id postgres &>/dev/null && chown postgres:postgres {{ postgresql_home_dir }}/.pgpass || true
  changed_when: false
