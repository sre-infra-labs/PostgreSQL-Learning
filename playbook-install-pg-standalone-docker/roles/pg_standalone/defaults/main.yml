minimal_ansible_version: "2.18.0"

# -------------------------------------------------------------------
# Package lists
# -------------------------------------------------------------------
system_packages:
  - python3
  - python3-psycopg2
  - python3-setuptools
  - python3-pip
  - python3-urllib3
  - python3-dev
  - less
  - vim
  - gcc
  - jq
  - acl
  - libpq-dev
  - curl
  - gnupg2
  - wget
  - tldr
  - lsb-release
  - inetutils-ping
  - ca-certificates

# Required: base PG packages — must all succeed
postgres_packages_required:
  - postgresql-common
  - postgresql-server-dev-{{ postgresql_version }}
  - postgresql-client-{{ postgresql_version }}
  - postgresql-{{ postgresql_version }}
  - postgresql-contrib-{{ postgresql_version }}
  - pgbackrest

# Optional: PGDG extension packages — installed best-effort (skip if not yet in repo for this PG version)
postgres_packages_optional:
  - postgresql-{{ postgresql_version }}-cron
  - postgresql-{{ postgresql_version }}-partman
  - postgresql-{{ postgresql_version }}-repack
  - postgresql-{{ postgresql_version }}-pgtap
  - postgresql-{{ postgresql_version }}-plpgsql-check
  - postgresql-{{ postgresql_version }}-pg-permissions
  - postgresql-{{ postgresql_version }}-pg-qualstats

# -------------------------------------------------------------------
# System user
# -------------------------------------------------------------------
postgres_user: "postgres"

# -------------------------------------------------------------------
# DBA config — override via vars/dba_vars.yml (set at playbook level)
# -------------------------------------------------------------------
postgresql_port:     "5432"
db_name:             "dba"
db_user_rw:          "dba_rw"
db_user_ro:          "dba_ro"

# -------------------------------------------------------------------
# Credentials (set via creds.yml / sensitive-values vault)
# -------------------------------------------------------------------
db_password:            "{{ creds.PG_SUPERUSER_PWD }}"
db_user_rw_password:    "{{ creds.DB_USER_RW_PASSWORD }}"
db_user_ro_password:    "{{ creds.DB_USER_RO_PASSWORD }}"

# Superuser for standalone PostgreSQL
postgres_superuser_username: "{{ postgres_user }}"
postgres_superuser_password: "{{ creds.PG_SUPERUSER_PWD }}"

# pgBackRest repository path (from sensitive-values)
pgbackrest_repo1_path: "{{ creds.PGBACKREST_REPO1_PATH }}"

# -------------------------------------------------------------------
# PostgreSQL paths
# -------------------------------------------------------------------
postgresql_home_dir:      "/var/lib/postgresql"
postgresql_data_dir:      "{{ postgresql_home_dir }}/{{ postgresql_version }}/main"
postgresql_data_archive:  "{{ postgresql_home_dir }}/{{ postgresql_version }}/archive"
postgresql_scripts_dir:   "{{ postgresql_home_dir }}/{{ postgresql_version }}/scripts"
postgresql_conf_dir:      "{{ postgresql_data_dir }}"
postgresql_bin_dir:       "/usr/lib/postgresql/{{ postgresql_version }}/bin"
postgresql_log_dir:       "/var/log/postgresql"
postgresql_unix_socket_dir: "/var/run/postgresql"
postgresql_stats_temp_directory_path: "{{ postgresql_home_dir }}_stats_tmp"

# -------------------------------------------------------------------
# PostgreSQL initdb settings
# -------------------------------------------------------------------
postgresql_encoding: "UTF8"
postgresql_locale: "C.UTF-8"
postgresql_data_checksums: true
postgresql_password_encryption_algorithm: "scram-sha-256"

# -------------------------------------------------------------------
# pg_hba.conf rules — for standalone
# -------------------------------------------------------------------
postgresql_pg_hba:
  - "local  all          all       trust"
  - "host   all          all       127.0.0.1/32  trust"
  - "host   all          all       ::1/128        trust"
  - "local  all          postgres  peer"
  - "host   all          all       0.0.0.0/0     scram-sha-256"
  - "host   all          all       ::/0           scram-sha-256"

# -------------------------------------------------------------------
# PostgreSQL parameters (for standalone)
# -------------------------------------------------------------------
postgresql_parameters:
  - { option: "max_connections",               value: "200" }
  - { option: "superuser_reserved_connections", value: "5" }
  - { option: "password_encryption",           value: "{{ postgresql_password_encryption_algorithm }}" }
  - { option: "max_locks_per_transaction",     value: "512" }
  - { option: "max_prepared_transactions",     value: "0" }
  - { option: "huge_pages",                    value: "off" }
  - { option: "shared_buffers",                value: "{{ (ansible_facts['memtotal_mb'] * 0.25) | int }}MB" }
  - { option: "effective_cache_size",          value: "{{ (ansible_facts['memtotal_mb'] * 0.75) | int }}MB" }
  - { option: "work_mem",                      value: "{{ pg_params['work_mem'] }}" }
  - { option: "maintenance_work_mem",          value: "{{ pg_params['maintenance_work_mem'] }}" }
  - { option: "max_worker_processes",          value: "{{ server_hardware['cpu_count'] }}" }
  - { option: "max_parallel_workers",          value: "{{ server_hardware['cpu_count'] }}" }
  - { option: "max_parallel_workers_per_gather", value: "{{ (server_hardware['cpu_count'] / 2) | int }}" }
  - { option: "checkpoint_timeout",            value: "5min" }
  - { option: "checkpoint_completion_target",  value: "0.9" }
  - { option: "min_wal_size",                  value: "512MB" }
  - { option: "max_wal_size",                  value: "2GB" }
  - { option: "wal_buffers",                   value: "16MB" }
  - { option: "default_statistics_target",     value: "100" }
  - { option: "autovacuum",                    value: "on" }
  - { option: "autovacuum_max_workers",        value: "3" }
  - { option: "autovacuum_vacuum_scale_factor", value: "0.2" }
  - { option: "autovacuum_analyze_scale_factor", value: "0.1" }
  - { option: "autovacuum_vacuum_cost_limit",  value: "-1" }
  - { option: "max_files_per_process",         value: "4096" }
  - { option: "logging_collector",             value: "on" }
  - { option: "log_truncate_on_rotation",      value: "on" }
  - { option: "log_rotation_age",              value: "1d" }
  - { option: "log_rotation_size",             value: "0" }
  - { option: "log_line_prefix",               value: "%t [%p-%l] %r %q%u@%d " }
  - { option: "log_filename",                  value: "postgresql-%a.log" }
  - { option: "log_directory",                 value: "{{ postgresql_log_dir }}" }
  - { option: "log_statement",                 value: "all" }
  - { option: "log_duration",                  value: "off" }
  - { option: "log_min_duration_statement",    value: "-1" }
  - { option: "track_io_timing",               value: "on" }
  - { option: "log_lock_waits",                value: "on" }
  - { option: "log_temp_files",                value: "0" }
  - { option: "track_activities",              value: "on" }
  - { option: "track_activity_query_size",     value: "4096" }
  - { option: "track_counts",                  value: "on" }
  - { option: "track_functions",               value: "all" }
  - { option: "log_checkpoints",               value: "on" }

postgresql_shared_preload_libraries: "pg_stat_statements,pg_cron"

postgresql_extension_parameters:
  - { option: "pg_stat_statements.max",   value: "10000" }
  - { option: "pg_stat_statements.track", value: "all" }
  - { option: "cron.database_name",            value: "postgres" }
  - { option: "cron.timezone",                 value: "Asia/Kolkata" }

# -------------------------------------------------------------------
# Backup settings (pgBackRest)
# -------------------------------------------------------------------
pgbackrest_stanza_name: "default"
pgbackrest_repo_path: "/var/lib/pgbackrest"
pgbackrest_repo1_type: "posix"
pgbackrest_repo1_retention_full: 7
pgbackrest_compress_type: "lz4"
pgbackrest_archive_command: "/usr/bin/pgbackrest --stanza={{ pgbackrest_stanza_name }} archive-push %p"
pgbackrest_restore_command: "/usr/bin/pgbackrest --stanza={{ pgbackrest_stanza_name }} archive-get %f %p"
pgbackrest_create_initial_backup: true
pgbackrest_initial_backup_type: "full"
pgbackrest_backup_timeout: 3600
pgbackrest_check_timeout: 300

pgbackrest_postgresql_parameters:
  - { option: "wal_level",       value: "replica" }
  - { option: "archive_mode",    value: "on" }
  - { option: "archive_timeout", value: "1800s" }
  - { option: "archive_command", value: "{{ pgbackrest_archive_command }}" }
  - { option: "restore_command", value: "{{ pgbackrest_restore_command }}" }
